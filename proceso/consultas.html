<title>Consultas de Raíces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Una columna de fichas, como un cuaderno de consultas: contexto, lo que se hizo, tu elección. */
:root{
  --bg:#f1f2ec; --hoja:#fbfbf7; --tinta:#1e2621; --suave:#5a665e; --linea:#d8dccf;
  --acento:#1f6a5f; --acento-suave:#e1eeea; --ocre:#9a5a16; --ocre-suave:#f6ead9;
  --pend:#a3610f; --ok:#2f7a3c; --gris:#7a8178;
  --f-titulo:"Alegreya",Georgia,serif; --f-texto:"Alegreya Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a17; --hoja:#1d2420; --tinta:#e6eae2; --suave:#a3ada5; --linea:#323b35;
  --acento:#6cc2b3; --acento-suave:#1f3631; --ocre:#e0a35a; --ocre-suave:#3a2c1b;
  --pend:#e0a35a; --ok:#79c48a; --gris:#8d958c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --hoja:#1d2420; --tinta:#e6eae2; --suave:#a3ada5; --linea:#323b35;
  --acento:#6cc2b3; --acento-suave:#1f3631; --ocre:#e0a35a; --ocre-suave:#3a2c1b;
  --pend:#e0a35a; --ok:#79c48a; --gris:#8d958c; color-scheme:dark}
body{background:var(--bg);color:var(--tinta);font:17px/1.5 var(--f-texto);padding-inline:16px;padding-block:0 64px}
.marco{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--linea);display:grid;gap:10px}
h1{font:700 1.7rem/1.1 var(--f-titulo);margin:0;text-wrap:balance}
.resumen{color:var(--suave);font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.resumen b{color:var(--tinta)}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros{display:flex;gap:4px;flex-wrap:wrap}
.filtros button{font:500 .9rem var(--f-texto);border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);border-radius:999px;padding:4px 12px;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--hoja)}
input[type=search]{flex:1 1 180px;min-width:0;font:inherit;font-size:.95rem;padding:5px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--hoja);color:var(--tinta)}
.copiar{font:700 .9rem var(--f-texto);background:var(--ocre);color:var(--hoja);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.aviso{font-size:.85rem;color:var(--suave)}
main{display:grid;gap:18px;padding-top:18px}
.ficha{background:var(--hoja);border:1px solid var(--linea);border-radius:10px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.ficha.pendiente{border-left:4px solid var(--pend)}
.ficha.tuya{border-left:4px solid var(--acento)}
.cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.num{font:500 .8rem var(--f-mono);color:var(--suave)}
.tema{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.estado{margin-left:auto;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.estado.pendiente{color:var(--pend)} .estado.respondida{color:var(--ok)} .estado.reemplazada{color:var(--gris)} .estado.tuya{color:var(--acento)}
h2{font:600 1.25rem/1.25 var(--f-titulo);margin:0;text-wrap:balance}
.cuerpo{color:var(--tinta);min-width:0;overflow-wrap:anywhere}
.cuerpo p,.hecho p,.resp p{margin:0 0 6px}
.cuerpo ul,.hecho ul{margin:0 0 6px;padding-left:20px}
code{font:500 .82em var(--f-mono);background:var(--acento-suave);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.hecho{background:var(--ocre-suave);border-radius:8px;padding:10px 12px;font-size:.95rem}
.hecho .et,.resp .et,.elige .et{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ocre);margin-bottom:4px}
.resp{background:var(--acento-suave);border-radius:8px;padding:10px 12px;font-size:.95rem}
.resp .et{color:var(--acento)}
.elige{display:grid;gap:6px}
.elige .et{color:var(--acento)}
.op{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;cursor:pointer}
.op:hover{border-color:var(--acento)}
.op input{margin-top:5px;accent-color:var(--acento);flex:none}
.op span{min-width:0}
.op.marcada{border-color:var(--acento);background:var(--acento-suave)}
.def{font-size:.72rem;font-weight:700;color:var(--ocre);text-transform:uppercase;letter-spacing:.05em;margin-left:6px;white-space:nowrap}
textarea{font:inherit;font-size:.95rem;width:100%;box-sizing:border-box;min-height:64px;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--bg);color:var(--tinta);resize:vertical}
.pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--suave)}
.pie button{font:500 .85rem var(--f-texto);background:none;border:1px solid var(--linea);color:var(--suave);border-radius:6px;padding:3px 10px;cursor:pointer}
details.cambiar>summary{cursor:pointer;color:var(--acento);font-size:.9rem;font-weight:500}
details.cambiar[open]>summary{margin-bottom:8px}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.vacio{color:var(--suave);text-align:center;padding:40px 0}
#copia{width:100%;min-height:140px}
@media (prefers-reduced-motion:no-preference){.op,.filtros button{transition:background .15s,border-color .15s}}
</style>

<div class="marco">
<header>
  <h1>Consultas de Raíces</h1>
  <div class="resumen" id="resumen"></div>
  <div class="barra">
    <div class="filtros" role="group" aria-label="Filtrar">
      <button type="button" data-f="pendiente" aria-pressed="true">Pendientes</button>
      <button type="button" data-f="tuyas" aria-pressed="false">Contestadas acá</button>
      <button type="button" data-f="todas" aria-pressed="false">Todas</button>
    </div>
    <input type="search" id="buscar" placeholder="Buscar (yerba, sonido, C-69…)" aria-label="Buscar">
    <button type="button" class="copiar" id="copiar">Copiar mis respuestas</button>
  </div>
  <div class="aviso" id="aviso">Conectando con el guardado…</div>
  <textarea id="copia" hidden readonly aria-label="Tus respuestas en texto"></textarea>
</header>
<main id="lista"></main>
</div>

<script>
const CONSULTAS = [{"id": "C-07", "titulo": "¿Aceptamos música con licencia CC BY-SA?", "cuerpo": "<p>Hay buenas grabaciones de siku y sikuri para Tawantinsuyu en Wikimedia, pero son CC BY-SA. Esa licencia obliga a dar crédito y a compartir con la misma licencia cualquier cambio que se haga a la pista, no al juego. Hoy solo se usa CC0 y dominio público.<\/p><p>Las grabaciones las publicó el propio intérprete en dominio público, pero suenan en el combate.<\/p><p>Ahora una casa mide unas tres veces un aldeano y todos andan un 10 % más lento. Para probarlo, jugá a velocidad ×1, no con el autotest, que corre a ×4.<\/p>", "opciones": [["a", "Sí, con crédito", true], ["b", "No, solo CC0", false], ["a", "Dejarla solo en el menú o en la paz, no en el combate", true], ["b", "Dejarla como está", false], ["c", "Sacarla", false], ["a", "Están bien", false], ["b", "Aldeanos todavía grandes", false], ["c", "Todavía rápidos", false], ["d", "Ahora demasiado lentos", false], ["a", "\"Una riqueza, seis motores\": un solo recurso, con nombre e ícono por civ, y que cada civ produce con su propio motor pacífico desde la edad I", true], ["b", "Solo cambiar la imagen y los nombres, sin tocar las reglas", false], ["c", "Un cuarto recurso distinto para cada civ", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, con crédito + a) Dejarla solo en el menú o en la paz, no en el combate + a) \"Una riqueza, seis motores\": un solo recurso, con nombre e ícono por civ, y que cada civ produce con su propio motor pacífico desde la edad I<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-37", "titulo": "¿Con qué pueblo se aprende?", "cuerpo": "<p>El tutorial usa a los guaraníes, que no tienen torre, granero ni depósito, y cuyos edificios tienen nombre propio (Oga, Aty, Kokue). El jugador nuevo pidió aprender con un pueblo \"más normal\" (<code>proceso/22-testers/02-nuevo-en-rts.md<\/code>).<\/p><p>AoE4 tiene misiones cortas de una sola idea (economía temprana, defensa, contadores, sitios, asedio) con medalla de bronce, plata y oro. El motor de escenarios ya alcanza para hacerlas (objetivos <code>juntar<\/code>, <code>sitio<\/code>, cuentas y ataques con aviso).<\/p><p>El mito de Inkarrí se documenta sobre todo en el siglo XX (Arguedas lo recogió en Puquio en 1956), aunque se lo vincula con el Taki Onqoy y con la muerte de Túpac Amaru I (1572). La edad IV cubre Vilcabamba (1537–1572) y Tinta (1780). Ya la investigación lo había dejado como \"a consultar\" (<code>docs/investigacion/tawantinsuyu.md<\/code>, punto 9). Sus dos hitos son Qorikancha y Vilcabamba.<\/p><p>El Qorikancha lo reconstruyó Pachakutiq hacia 1438: como obra de la última edad es anacrónico. Moverlo a la edad II o III cambia los hitos y, por lo tanto, el balance del Tawantinsuyu, que está en revisión (parte A).<\/p><p>Los datos dicen <em>Tekoha → Amundá → Mbororé → Tava<\/em>. La investigación propone <em>Tekoha → cuñadazgo y conquista → Tava o monte → Mbororé y Guerra Guaranítica<\/em> (<code>docs/investigacion/guaranies.md<\/code>, \"Periodización\"). En los datos, la bifurcación misión o monte está en el avance a la III y los hitos de la IV (<em>Tava fortificada<\/em> y <em>Ñande retã<\/em>) son de la Guerra Guaranítica, así que el orden de los datos tiene lógica, pero termina en \"Tava\" y se lee como si la meta fuera reducirse. Además, <strong>\"Amundá\" no tiene fuente ni explicación<\/strong> en ningún documento.<\/p><p>Se lee como una opción de menú, no como un nombre. La edad IV es la bifurcación entre el <em>Pacto de Cucaú<\/em> (Gana Zumba, 1678) y la <em>Guerra de Zumbi<\/em>, y esas ya son sus dos opciones de hito.<\/p><p>Cambié \"roças\" por \"rozas\", \"milho\" por \"maíz\" y \"farinha\" por \"fariña\" (castellano del litoral) en las campañas de Palmares y guaraníes, porque tienen palabra propia en castellano. Dejé las que nombran instituciones o lugares sin equivalente (<em>mocambo<\/em>, <em>quilombo<\/em>, <em>terço<\/em>, <em>morador<\/em>, <em>bandeira<\/em>). Queda \"la mata\" en Palmares (en castellano rioplatense, \"mata\" es un arbusto; sería \"el monte\").<\/p><p>La parte D sumó seis civs solo de IA: Adal, Birmania (Toungoo y Konbaung juntos), chankas, caranquis y cayambes, cañaris y tupíes (<code>proceso/23-como-aoe4/04-rivales-propios.md<\/code>). Quedan con la civ del jugador las milicias de Pumakawa (incas), los señores de Lasta (etíopes) y los señores de Phitsanulok, Phimai y Fang (siameses), que sí son del mismo pueblo. Los holandeses, franceses, paulistas y la tropa de Jorge Velho siguen como <code>invasores<\/code>.<\/p><p>Hoy son 500/500/300/300 y 1000/1000/700/700 (alimento, madera, piedra, riqueza), parecidos a los de AoE2 (<code>proceso/24-tras-la-segunda-ronda/4b-opciones-de-partida.md<\/code>).<\/p><p>Ahora el 2v2 y el 3v3 del menú arrancan con los aliados juntos, como el lobby de AoE4. Antes quedaban mezclados por el orden de los lugares.<\/p><p>Si al cumplirse el tiempo los puntos empatan, hoy no gana nadie y la pantalla dice \"Empate\".<\/p><p>Con \"Hitos: no\", pierde quien se queda sin edificios terminados. No cuentan muros, puertas ni caminos; sí granjas, casas y almacenes.<\/p><p>En 4 partidas de IA contra IA de hasta 45 minutos, sin hitos ni sitios, la IA nunca termina la conquista (al mapuche le quedaban 41 edificios).<\/p><p>Faltan maravilla (no existe todavía), edad inicial, población máxima y \"revelar mapa\".<\/p><p>La experta llega a 100 aldeanos a los 25 minutos en tres civs y levanta un segundo o tercer centro, pero contra la difícil pierde 2 de 6 partidas, gana 1 y 3 quedan abiertas a los 25 minutos. Su economía grande llega tarde: a los 10–15 minutos tiene igual o menos ejército (<code>proceso/24-tras-la-segunda-ronda/4a-ia-experta.md<\/code>).<\/p><p>El torneo de balance se juega con la normal. Palmares no crece con centros sino con la fama, así que con la experta queda abajo por diseño.<\/p><p>El sonido mapuche (fanfarria, alarma y órdenes) usa kultrun y trutruka sintetizados (<code>proceso/24-tras-la-segunda-ronda/4g-sonido.md<\/code>). El kultrun es un instrumento ceremonial de la machi. Ya estaba pendiente consultar la pifilka.<\/p><p>La música nueva de Etiopía (C-24) abre y cierra con begena, el arpa de la oración ortodoxa. Solo suena en la paz, nunca en combate ni en alarmas, y no hay voces ni nada que imite el zema.<\/p><p>El sonido de Palmares usa berimbau y atabaque. El berimbau de arco con calabaza está documentado en Brasil sobre todo desde el siglo XIX [verificar]; en el Palmares del siglo XVII podría ser un anacronismo.<\/p><p>Son instrumentos rituales del opy mbyá. Desde el paso 4h no suenan en la tropa: en su lugar, mimby (flauta de caña) y angu'apu (tambor de tronco), según Montoya, 1639 [verificar].<\/p><p>Tiene dos grabaciones de berimbau con toques de capoeira y una de ijexá (un ritmo del candomblé). El sonido de tropa ya es de raíz angoleña (paso 4h).<\/p><p>El kebero también es tambor litúrgico [verificar]. La orden ya pasó al krar.<\/p><p>Podría ser del repertorio ceremonial naphat [verificar].<\/p><p>El hito \"Casa del karai\" muestra bastones con plumas y una mbaraka (<code>data/arte_hitos.json<\/code>).<\/p><p>La fácil tiene tope de 15 soldados, pero la segunda oleada pide 18 (12 + 6). Si la primera se traba, no vuelve a atacar y a veces la partida no termina (<code>proceso/24-tras-la-segunda-ronda/4j-jugador-nuevo-ronda-3.md<\/code>).<\/p><p>Hoy un sitio guarda lo que lleva de captura aunque el que lo toma se vaya, y varias pasadas cortas suman los 10 s. En AoE4, la captura se vacía de a poco sin nadie. Cambiaría la regla para todos y el balance.<\/p>", "opciones": [["a", "Dejar a los guaraníes: los nombres propios con el común debajo ya se entienden", true], ["b", "Pasar el tutorial a Tawantinsuyu, que tiene todos los edificios comunes", false], ["a", "Sí, cinco misiones cortas con medallas por tiempo, después de la etapa 23", true], ["b", "No por ahora", false], ["a", "Dejar Inkarri y explicarlo en el panel del pueblo como un guiño al arco de la campaña, no como un nombre de época", true], ["b", "<em>Vilcabamba<\/em> (choca con el nombre del hito militar)", false], ["c", "<em>Neo Inka<\/em>", false], ["d", "Otro (escribilo)", false], ["a", "Cambiarle el nombre a la opción económica de la edad IV (por ejemplo, <em>Wak'a rehenes<\/em> o <em>Huacas del Cusco<\/em>), sin tocar sus números", true], ["b", "Pasarlo a la edad III y llevar el aqllawasi o la kallanka real a la IV (rebalancea)", false], ["c", "Dejarlo así", false], ["a", "<em>Tekoha → Tovaja (cuñadazgo) → Mbororé → Ñande retã<\/em> (la III es la de Mbororé, 1641, y la IV, la de 1754–1756)", true], ["b", "Seguir la investigación: III <em>Tava ha ka'aguy<\/em> (pueblo y monte), IV <em>Mbororé<\/em>", false], ["c", "Dejarlo así y explicarlo en el panel. En cualquier caso, ¿de dónde sale \"Amundá\"? [verificar <em>tovaja<\/em> con un hablante]", false], ["a", "Un solo nombre: <em>Macaco<\/em> (la cerca real de la Serra da Barriga, donde siguió Zumbi)", true], ["b", "<em>1678<\/em>", false], ["c", "<em>Angola Janga<\/em> para la IV y otro nombre para la III", false], ["d", "Dejarlo y explicar la bifurcación en el panel", false], ["a", "Ese criterio, y \"la mata\" pasa a \"el monte\"", true], ["b", "Volver al portugués de época, siempre en cursiva y con un glosario en el juego", false], ["c", "Ese criterio, pero \"la mata\" se queda (es la <em>mata atlántica<\/em>)", false], ["a", "Así", true], ["b", "Separar también a los europeos por potencia (Castilla, Portugal, Países Bajos, Francia), con nombres de edad propios en vez de <em>Virreinato<\/em> para todos", false], ["a", "Esos", true], ["b", "Otros (decí cuáles)", false], ["a", "Juntos", true], ["b", "Mezclados", false], ["a", "Empate", true], ["b", "Desempate por edificios en pie o por sitios", false], ["a", "Solo edificios", true], ["b", "También las unidades, como algunos modos de AoE4 (se alarga la caza del último aldeano)", false], ["a", "El menú sugiere un tiempo límite al apagar \"Hitos\", y la IA aprende a cazar los últimos edificios en el paso de la IA experta", true], ["b", "Solo mejorar la IA", false], ["a", "Población máxima y revelar mapa ahora; edad inicial y maravilla después", true], ["b", "Ninguna por ahora", false], ["c", "Todas", false], ["a", "Otro paso de ajuste con torneo de la experta contra la difícil", true], ["b", "Dejarla así por ahora", false], ["a", "El balance se mide con la normal, y la experta solo se revisa para que ninguna civ quede inútil", true], ["b", "Sumar un torneo con la experta y balancear también ahí", false], ["a", "Dejarlo, y consultarlo con una organización mapuche junto con la pifilka antes de publicar", true], ["b", "Usar solo la trutruka hasta tener esa consulta", false], ["a", "Así, y consultarlo con alguien de la tradición ortodoxa etíope antes de publicar", true], ["b", "Reemplazar la begena por krar, que es profano", false], ["a", "Dejarlo: es el instrumento afrobrasileño que más se reconoce", true], ["b", "Solo atabaque y agogô", false], ["a", "Así, hasta consultar con una organización mbyá", true], ["b", "Volver a la mbaraka", false], ["a", "Dejarlas hasta tener una música propia sintetizada de ngoma y marimba", true], ["b", "Sacarlas ya", false], ["a", "Dejarlo y preguntarlo junto con C-54", true], ["b", "Sacarlo también de esos tres", false], ["a", "Dejarla hasta confirmar", true], ["b", "Sacarla", false], ["a", "Dejarlo: es la casa del karai, donde corresponde", true], ["b", "Sacar la mbaraka del modelo", false], ["a", "Bajar el paso de la oleada de la fácil para que ataque varias veces, con oleadas chicas: el principiante tiene un segundo ataque que rechazar", true], ["b", "Subir su tope de ejército", false], ["a", "Que se vacíe de a poco, como AoE4, medido con torneo", true], ["b", "Dejarlo como está", false]], "respuesta": "", "hecho": ["<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>", "<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>", "<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>", "<p>Aplicada la b) por la revisión histórica (etapa 25): la música de paz de Palmares quedó sin pistas propias. Si contestás a), se revierten dos líneas de <code>audio.gd<\/code>.<\/p>"], "estado": "pendiente", "tema": "aprender a jugar"}, {"id": "C-63", "titulo": "Sitios apagados para la IA contra IA", "cuerpo": "<p>La primera partida en Fácil arranca con los sitios apagados. En IA contra IA, desde el menú, la opción depende de la dificultad elegida para el jugador.<\/p>", "opciones": [["a", "Que IA contra IA siempre arranque con los sitios prendidos", true], ["b", "Igual que la partida normal", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Que IA contra IA siempre arranque con los sitios prendidos<\/p>"], "estado": "pendiente", "tema": "menú"}, {"id": "C-64", "titulo": "La micro: que la mezcla de línea y distancia pague", "cuerpo": "<p>El veterano lo pide por tercera ronda. El estudio (<code>proceso/24-tras-la-segunda-ronda/5a-micro-estudio.md<\/code>) encontró dos causas. El guerrero común corre más que el hondero (1600 contra 1250), así que funciona como un jinete a pie y no se lo puede kitear. Y el hondero casi no le hace daño. Lo que ya paga: la línea mantiene y la distancia escalona detrás.<\/p><ul><li>Con a), 5 lanceros + 5 honderos sin micro pasan de ganar 1 de 5 a ganar 5 de 5 contra 10 guerreros, y los honderos que escalonan quedan con 5,2 vivos.<\/li><li>El weichafe, el jinete noble y el jinete conservan su velocidad.<\/li><\/ul>", "opciones": [["a", "Guerrero común a 1350 y la línea +6 contra el choque (antes +5), como el hombre de armas de AoE4, medido con torneo", true], ["b", "Solo la línea +10 contra el choque", false], ["c", "Un hostigador montado por pueblo (pide modelo, edificio e IA)", false], ["d", "Dejarlo así y enseñar en el juego la micro que ya paga", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Guerrero común a 1350 y la línea +6 contra el choque (antes +5), como el hombre de armas de AoE4, medido con torneo<\/p>"], "estado": "pendiente", "tema": "combate"}, {"id": "C-66", "titulo": "Huellas del centro y los hitos", "cuerpo": "<p>En AoE4 el centro y los hitos dominan la ciudad. Acá ocupan 4×4 casillas (el lof mapuche, 3×3). Pasarlos a 5×5 (el lof a 4×4) toca la colocación, la IA, el generador de mapas (quizás un mapa de 136 en vez de 128), los caminos, las 25 misiones y el balance. Las casas, granjas y almacenes no cambian.<\/p>", "opciones": [["a", "Esperar a ver el paso 1 (solo vista) y decidir después", true], ["b", "Hacerlo ya, con su torneo", false], ["c", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Esperar a ver el paso 1 (solo vista) y decidir después<\/p>"], "estado": "pendiente", "tema": "escala"}, {"id": "C-67", "titulo": "La yerba", "cuerpo": "<p>Hoy la roza agotada deja un yerbal. Pero la yerba (<em>ka'a<\/em>) era un árbol silvestre del monte. En la colonia se cosechó con trabajo forzado de encomienda, y solo las reducciones del siglo XVIII la plantaron (Garavaglia, 1983).<\/p>", "opciones": [["a", "La yerba como recurso silvestre del monte; el yerbal plantado recién en la vía misión; la roza agotada deja capuera; ganado vacuno en la vía misión. Medido con torneo", true], ["b", "Dejarlo y aclararlo en la descripción", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) La yerba como recurso silvestre del monte; el yerbal plantado recién en la vía misión; la roza agotada deja capuera; ganado vacuno en la vía misión. Medido con torneo<\/p>"], "estado": "pendiente", "tema": "historia, guaraníes"}, {"id": "C-68", "titulo": "Pacto de Cucaú y liberación", "cuerpo": "<p>El Pacto de Cucaú promete \"cerrar la puerta a quienes llegan\", pero en los datos es un +25 % sin costo. La liberación \"libera\" gente de cualquier casa enemiga, también guaraní o etíope.<\/p>", "opciones": [["a", "El pacto apaga o reduce a la mitad la acogida y la liberación; la liberación vale solo contra los ingenios y los invasores (contra los demás pueblos, nada). Medido con torneo", true], ["b", "Dejarlo", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El pacto apaga o reduce a la mitad la acogida y la liberación; la liberación vale solo contra los ingenios y los invasores (contra los demás pueblos, nada). Medido con torneo<\/p>"], "estado": "pendiente", "tema": "historia, Palmares"}, {"id": "C-69", "titulo": "Lalibela y la iglesia", "cuerpo": "<p>Lalibela es un sitio zagwe del siglo XIII con culto vivo: en el juego se construye y da +25 % de vida a los edificios. La iglesia da +5 % de vida a las tropas.<\/p>", "opciones": [["a", "Lalibela pasa a sitio sagrado neutral del mapa (no se construye) y el hito se ve como Debre Damo; la iglesia cambia su bono de combate por uno económico o de población", true], ["b", "Dejarlo", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Lalibela pasa a sitio sagrado neutral del mapa (no se construye) y el hito se ve como Debre Damo; la iglesia cambia su bono de combate por uno económico o de población<\/p>"], "estado": "pendiente", "tema": "historia, Etiopía"}, {"id": "C-70", "titulo": "Nombres de edad", "cuerpo": "<p>Las propuestas de los historiadores:<\/p><ul><li>incas: <em>Inkarri<\/em> → <em>Willkapampa<\/em>, y el hito militar → <em>Espíritu Pampa<\/em> (C-39);<\/li><li>guaraníes: <em>Tekoha → Guára → Mbororé → Ñande retã<\/em> (C-41; desaconsejan <em>tovaja<\/em>; <em>guára<\/em>, a confirmar con un hablante);<\/li><li>birmanos: <em>Hanthawaddy<\/em> → <em>Toungoo<\/em>;<\/li><li>Ayutthaya: <em>Mueang Tha<\/em> → <em>Krung Thonburi<\/em>, y explicar <em>Ekkarat<\/em> en el panel;<\/li><li>Palmares: no la a) de C-42, sino la b) \"1678\" o la d);<\/li><li>Qorikancha: a la edad II o III (C-40 b).<\/li><\/ul>", "opciones": [["a", "Todo eso", true], ["b", "Elegir de a uno (decí cuáles)", false]], "respuesta": "", "hecho": ["<p>En la página elegiste C-40 b (Qorikancha a la III), C-41 a (Tekoha → Tovaja → Mbororé → Ñande retã) y C-42 b («1678»), y dejaste C-39 (el nombre de la IV inca) para esta. Ya se aplican; acá falta lo demás (Willkapampa, birmanos, Ayutthaya) o confirmar esas tres.<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-71", "titulo": "Birmania y los extranjeros de Ayutthaya", "cuerpo": "<ul><li><em>Bayingyi<\/em> (tiradores) y <em>kathe<\/em> (caballería) son de 1613 en adelante y de la época Konbaung; en la edad II y en Nong Sarai (1593) son anacrónicos.<\/li><li>Falta el barrio chino, la comunidad extranjera más grande de Ayutthaya (defendió la muralla en 1767 y sostuvo a Taksin).<\/li><\/ul>", "opciones": [["a", "Bayingyi y kathe solo en la edad IV (antes, \"tiradores portugueses a sueldo\" y \"jinete shan\"); barrio chino como tercer barrio de Ayutthaya; Birmania con monasterio de teca, pyatthat y zedi propios", true], ["b", "Solo los nombres", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Bayingyi y kathe solo en la edad IV (antes, \"tiradores portugueses a sueldo\" y \"jinete shan\"); barrio chino como tercer barrio de Ayutthaya; Birmania con monasterio de teca, pyatthat y zedi propios<\/p>"], "estado": "pendiente", "tema": "historia, Asia"}, {"id": "C-72", "titulo": "Otros nombres", "cuerpo": "<ul><li><strong>Hitos mapuches:<\/strong> Malón del toqui, Nguillatuwe del rewe, Corral de la remonta (o <em>Kawellu<\/em>) y Pewenal. Hoy inventan cargos como \"toqui de caballería\".<\/li><li><strong>Edificios:<\/strong> \"Ruka de guerra\" → \"Junta de guerra\"; \"Kamayuq wasi\" → <em>Qhuya wasi<\/em>; \"Tukul\" → <em>Gojjo bet<\/em>.<\/li><li><strong>Ayutthaya:<\/strong> la riqueza pasa a llamarse \"Suai (pago al rey)\".<\/li><li><strong>Rebaños:<\/strong> cerdo o gallinas en Palmares; buey cebú en Etiopía.<\/li><li><strong>Rivales:<\/strong> europeos por potencia, y Velho como facción \"paulista\" (C-44 b).<\/li><\/ul>", "opciones": [["a", "Todo eso", true], ["b", "De a uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Todo eso<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-73", "titulo": "Lo que quedaba abierto", "cuerpo": "<ul><li>C-58: nagarit (el timbal real de guerra) en la fanfarria y la alarma etíopes, en lugar del kebero litúrgico.<\/li><li>C-59: sacar <em>Tra Nimit<\/em> (muy probablemente del repertorio ceremonial <em>naphat<\/em>; la grabación es de una banda naval de 1934). Hoy es la única pista propia de Ayutthaya.<\/li><li>Alarma de Ayutthaya con klong chana, pi chawa y sang.<\/li><\/ul>", "opciones": [["a", "Todo eso, con música propia de paz para Palmares (ngoma y marimba) y para Ayutthaya, sintetizadas", true], ["b", "De a uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Todo eso, con música propia de paz para Palmares (ngoma y marimba) y para Ayutthaya, sintetizadas<\/p>"], "estado": "pendiente", "tema": "historia, sonido"}, {"id": "C-74", "titulo": "Representación y consultas", "cuerpo": "<ul><li><strong>Wat:<\/strong> que no muestre una imagen del Buda reconocible hasta consultar, y revisar si conviene que se pueda destruir.<\/li><li><strong>Hito guaraní:<\/strong> la mbaraka sale del modelo hasta la consulta mbyá (C-60 b).<\/li><li><strong>A futuro:<\/strong> los oromo como facción de IA, con el gada; misiones de Adal; rivales Lan Na, Lan Xang y Camboya.<\/li><li><strong>Consultas antes de publicar:<\/strong><\/li><li>la Iglesia ortodoxa Tewahedo;<\/li><li>las comunidades hararí, oromo y beta israel;<\/li><li>las organizaciones mapuches, mbyá, quechuas y quilombolas (CONAQ);<\/li><li>mestres de capoeira angola;<\/li><li>lingüistas de kimbundu.<\/li><\/ul>", "opciones": [["a", "Así", true], ["b", "Otra cosa", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-75", "titulo": "Regla del ×2", "cuerpo": "<p>¿\"Una unidad de la edad IV no vale más de dos comunes\" (ley cuadrada, como mide el modelo) o \"ni el ataque ni la vida pasan de ×2\" (más permisiva)?<\/p>", "opciones": [["a", "Valor en comunes", true], ["b", "Por estadística", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Valor en comunes<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-76", "titulo": "Hitos militares con aura", "cuerpo": "<p>En la III y la IV, el bono del hito militar vale solo cerca del hito, en lugar de ser global. Es lo que más desinfla la edad IV.<\/p>", "opciones": [["a", "Sí, en el paso 4", true], ["b", "Solo el de la IV", false], ["c", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, en el paso 4<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-77", "titulo": "Paso 1", "cuerpo": "<p>Sacar el bono automático de ataque por edad y reemplazarlo por cosas que se compran: el +10 % de la II va a la herrería I, y los niveles veterano y élite se compran. El modelo da el mismo poder (0 a −2 %).<\/p>", "opciones": [["a", "Sí, arrancar por ahí", true], ["b", "Primero la herrería separada", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, arrancar por ahí<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-78", "titulo": "Maravilla", "cuerpo": "<p>Costo de 1500 de madera, piedra y riqueza; 600 s de obra; una cuenta de 15 minutos para ganar; opción del menú.<\/p>", "opciones": [["a", "Así", true], ["b", "Otros números", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-79", "titulo": "Maravilla de Ayutthaya", "cuerpo": "<p>Krung, la ciudad isla con el fuerte Phom Phet (no es sagrada), o el Wat Phra Si Sanphet (con consulta).<\/p>", "opciones": [["a", "Krung", true], ["b", "El wat, si la consulta lo acepta", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): el historiador de Asia recomienda cerrarla en a). Hacer del Wat Phra Si Sanphet una maravilla repite el saqueo de 1767.<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-81", "titulo": "Trepanación", "cuerpo": "<p>El saber destacado inca: el 20 % de los caídos cerca del sanador o de la kallanka vuelve con media vida, en lugar de un sanador más fuerte. Evidencia arqueológica fuerte (Verano, 2016).<\/p>", "opciones": [["a", "Así", true], ["b", "Solo un sanador más fuerte", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): la cifra queda corregida (en la época inca sobrevivía el 75–83 %; en la Guerra Civil de Estados Unidos moría el 46–56 %), como un saber de dos mil años que el Inka heredó. La mecánica pasa a \"el 20 % de los que caen por golpe no muere y vuelve herido\", para que no se lea como resurrección.<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-82", "titulo": "Etiopía y el *Bahrä Hasab*", "cuerpo": "<p>Un saber eclesiástico (el cómputo del calendario) usado en una mecánica económica.<\/p>", "opciones": [["a", "Consultar a la Iglesia Tewahedo y, si no, \"Cartógrafos de la corte\"", true], ["b", "Sacarlo ya", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): el Bahrä Hasab es el cómputo de la Pascua, y ninguna fuente dice que ordenara las mudanzas de la corte. La opción nueva por defecto es el orden del kätäma (el campamento real armado siempre con el mismo plano), que está documentado.<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-83", "titulo": "Saberes con evidencia \"debatida\"", "cuerpo": "<p>El kilombo, el shotel, los armeros de Gondar y el yachaywasi tienen evidencia debatida.<\/p>", "opciones": [["a", "Entran con la marca \"debatido\" en la ficha", true], ["b", "Solo saberes documentados y arqueológicos", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Entran con la marca \"debatido\" en la ficha<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-84", "titulo": "Élite de la vía monte", "cuerpo": "<p>Sepé y la Guerra Guaranítica eran de los pueblos de misión. La élite de la vía monte pasa a los <em>ka'aguygua<\/em> (\"monteses\") [verificar grafía].<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, guaraníes"}, {"id": "C-85", "titulo": "Maravilla", "cuerpo": "<p><em>Tekoha guasu<\/em> es una categoría del siglo XX, hoy usada en litigios por tierras. Pasa a llamarse \"Aldea grande del monte\" hasta la consulta.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, guaraníes"}, {"id": "C-86", "titulo": "Ampive y poncho", "cuerpo": "<p><em>Lawentuchefe<\/em> es un término de fines del siglo XX y la platería, de fines del XVIII. Pasan a <em>ampive<\/em> [verificar] y al poncho (<em>makuñ<\/em>).<\/p>", "opciones": [["a", "Los dos", true], ["b", "Solo uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Los dos<\/p>"], "estado": "pendiente", "tema": "saberes, mapuches"}, {"id": "C-87", "titulo": "Pieza pesada de la IV", "cuerpo": "<p>Las armas capturadas en Vilcabamba, en lugar de repetir las galgas.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, incas"}, {"id": "C-88", "titulo": "Huayrachina", "cuerpo": "<p>El horno de viento que fundió la plata de Potosí: documentado y arqueológico. Entra en la IV, y los <em>mitmaqkuna<\/em> quedan para retomar.<\/p>", "opciones": [["a", "Sí", true], ["b", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, incas"}, {"id": "C-89", "titulo": "Escuela de la IV", "cuerpo": "<p><em>Oficinas do Macaco<\/em>: herreros, alfareros y tejedores de palma.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-90", "titulo": "Guerrero de gaša", "cuerpo": "<p>El \"shotel que pasa por encima del escudo\" es folclore moderno. Pasa a ser el guerrero de <em>gaša<\/em> (escudo) con jabalinas, sin ese bono.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Etiopía"}, {"id": "C-91", "titulo": "Jinetes oromo aliados", "cuerpo": "<p>El <em>gadaa<\/em> es un sistema de grados de edad, no un cuerpo montado. La élite de la IV pasa a ser jinetes oromo aliados por un tratado que se puede romper.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Etiopía"}, {"id": "C-92", "titulo": "Hierro de Angola Janga", "cuerpo": "<p>El hierro iba a armas y herramientas: la mejora da +1 de ataque en lugar de armadura.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-93", "titulo": "Erveira y sanguar", "cuerpo": "<p>El sanador es la <em>erveira<\/em> (Sweet, 2003, nivel \"debatido\"; nunca <em>nganga<\/em>). La mejora de curadores pasa al <em>sanguar<\/em>, la técnica de esquivar proyectiles, aclarando que no es capoeira.<\/p>", "opciones": [["a", "Las dos", true], ["b", "Solo una", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Las dos<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-94", "titulo": "Saberes nuevos de Etiopía y Palmares", "cuerpo": "<p><em>Ṭef<\/em> y <em>gotära<\/em>, <em>kosso<\/em>, los mercaderes <em>jabarti<\/em>, los <em>ṣäḥafe tə'əzaz<\/em>; tejido de palma y cerámica de los mocambos.<\/p>", "opciones": [["a", "Como quedan en el diseño", true], ["b", "Elegir", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Como quedan en el diseño<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-95", "titulo": "Sin astrología de corte", "cuerpo": "<p>La astrología de corte (los <em>hon<\/em>) se usaba como bono. Pasa a astilleros de juncos y al Phra Khlang con sus intérpretes.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Ayutthaya"}, {"id": "C-96", "titulo": "Saberes nuevos", "cuerpo": "<p>La cerámica de Si Satchanalai, los <em>khlong lat<\/em> y el <em>nuat<\/em>.<\/p>", "opciones": [["a", "Sí", true], ["b", "Elegir", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Ayutthaya"}, {"id": "C-97", "titulo": "La maravilla", "cuerpo": "<p>La Cerca do Outeiro da Barriga queda \"sitiada\" hasta consultar si se puede mostrar su caída.<\/p>", "opciones": [["a", "Así", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-98", "titulo": "Aspecto de los aldeanos animados", "cuerpo": "<p>De lejos, el aldeano animado se ve más claro y menos integrado que el modelo de Meshy: ganamos el movimiento y perdimos textura.<\/p>", "opciones": [["a", "Dejarlos animados y riggear los modelos de Meshy cuando se pueda, para tener las dos cosas", true], ["b", "Volver a Meshy quieto hasta riggear", false], ["c", "Animados, pero con colores más oscuros y terrosos ya", true]], "respuesta": "", "hecho": ["<p>Se hizo a + c: aldeanos animados con KayKit y tonos más terrosos. El rig propio ya existe en el pipeline 3D local (<code>proceso/47<\/code>): el aldeano inca anda con las animaciones de KayKit en el visor, falta pasarlo a <code>AldeanoAnimado<\/code>.<\/p>"], "estado": "pendiente", "tema": "animaciones"}, {"id": "C-99", "titulo": "Tono y armas", "cuerpo": "<p>¿Alcanza el tono del aldeano o lo oscurecemos más? ¿Un tono de piel por pueblo? ¿Están bien las armas de cada pueblo (macana a dos manos para guaraníes y mapuches, dos espadas para Ayutthaya, jabalina etíope, estólica caranqui)?<\/p>", "opciones": [["a", "Así como está", true], ["b", "Más oscuro, con un tono por pueblo", false], ["c", "Cambiar armas (escribí cuáles)", false]], "respuesta": "", "hecho": ["<p>Quedó así como está. Los modelos nuevos del pipeline (<code>proceso/49<\/code>, <code>50<\/code>) toman el tono de piel del arte 2D de cada pueblo.<\/p>"], "estado": "pendiente", "tema": "animaciones"}, {"id": "C-100", "titulo": "¿Reparar cuesta?", "cuerpo": "<p>En AoE4 reparar cuesta una parte del edificio; acá hoy es gratis.<\/p>", "opciones": [["a", "El 50 % del costo, proporcional a lo reparado", true], ["b", "Gratis, como hoy", false], ["c", "Otro porcentaje (escribilo)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El 50 % del costo, proporcional a lo reparado<\/p>"], "estado": "pendiente", "tema": "fluidez"}, {"id": "C-102", "titulo": "¿Dónde va el relevo?", "cuerpo": "<p>Para jugar por internet, los dos se conectan a un relevo (<code>server/relevo.py<\/code>). Opciones, con los pasos en <code>44-version-para-amigos/guia-relevo-y-versiones.md<\/code>:<\/p><p>Cuando lo tengas, poné <code>RELEVO=host:47900<\/code> en <code>~/.config/raices/publicar.env<\/code>. Así los amigos solo escriben el código de la sala.<\/p>", "opciones": [["a", "En tu PC, con el puerto 47900/TCP abierto en el router: gratis, pero solo anda con la PC prendida, y si tenés CGNAT no se puede", false], ["b", "Oracle Cloud Always Free: gratis y siempre prendido, pero con más vueltas para crearlo", false], ["c", "Un VPS de 4–6 USD por mes (Hetzner, DigitalOcean): lo más simple y estable", true]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: c) Un VPS de 4–6 USD por mes (Hetzner, DigitalOcean): lo más simple y estable<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-103", "titulo": "Página de itch.io", "cuerpo": "<p>Para que la app de itch les actualice el juego solo, hace falta una página. Va con estos pasos: crearla en modo <strong>Restricted<\/strong> o <strong>Draft<\/strong>, correr <code>butler login<\/code>, poner <code>ITCH_TARGET=usuario/raices<\/code> en <code>~/.config/raices/publicar.env<\/code> y correr <code>tools/publicar.sh --subir<\/code>. ¿Cómo entran los amigos?<\/p>", "opciones": [["a", "Con una clave de descarga por amigo", true], ["b", "Con una contraseña de página para todos", false], ["c", "Nada de itch por ahora: les mando los zip a mano", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Con una clave de descarga por amigo<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-104", "titulo": "Nombre de la versión", "cuerpo": "<p>Hoy la versión es <code>AAAA.MM.DD-commit<\/code> (por ejemplo <code>2026.11.20-1a2b3c4<\/code>). ¿Te sirve, o preferís un número (0.1, 0.2…) que subas vos?<\/p>", "opciones": [["a", "Fecha y commit", true], ["b", "Número a mano, más el commit", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Fecha y commit<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-106", "titulo": "Modelos del pipeline 3D en el juego (proceso/47)", "cuerpo": "<p>Los cuatro modelos nuevos (aldeano, kancha, kallanka y caballo, con textura de Hunyuan3D-Paint) están en <code>assets/generados/modelos/local/<\/code> y no se usan todavía. Ver el antes y después en <code>proceso/47-pipeline-3d/README.md<\/code>.<\/p>", "opciones": [["a", "Usar ya la kancha y la kallanka (estáticas) en los incas y dejar el aldeano para cuando <code>AldeanoAnimado<\/code> acepte modelos riggeados", true], ["b", "Usar los cuatro ya, con el aldeano quieto como el GLB de hoy", false], ["c", "Esperar a pasar todas las civilizaciones por el pipeline", false]], "respuesta": "", "hecho": ["<p>Los modelos no se usan todavía en el juego. Desde que se escribió la pregunta, ya pasaron por el pipeline los seis pueblos (la condición de la c) se cumplió) y se arregló la piel oscura (<code>proceso/50<\/code>).<\/p>"], "estado": "pendiente", "tema": "general"}];
const RESPONDIDAS = 21; // ya pasadas a CONSULTAS.md, fuera de esta página
const LS = "raices_consultas_v1";
let mias = {};           // id -> {opcion, texto, fecha}
let db = null, col = null;
let filtro = "pendiente", busca = "";
const VIGENTES = new Set(CONSULTAS.map(c => c.id));
// Lo de consultas que ya salieron de la página (respondidas y pasadas a CONSULTAS.md) se olvida.
const soloVigentes = o => Object.fromEntries(Object.entries(o || {}).filter(([k]) => VIGENTES.has(k)));
try { mias = soloVigentes(JSON.parse(localStorage.getItem(LS) || "{}")); localStorage.setItem(LS, JSON.stringify(mias)); } catch (e) { mias = {}; }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plano = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };

function tieneMia(id){ const m = mias[id]; return !!(m && (m.opcion || (m.texto || "").trim())); }

function resumen(){
  const tuyas = CONSULTAS.filter(c => tieneMia(c.id)).length;
  $("#resumen").innerHTML = `<span><b>${CONSULTAS.length - tuyas}</b> te faltan</span><span><b>${tuyas}</b> contestadas acá desde la última pasada</span><span><b>${RESPONDIDAS}</b> ya respondidas y aplicadas (en CONSULTAS.md)</span>`;
}

function visible(c){
  if (filtro === "pendiente" && c.estado !== "pendiente") return false;
  if (filtro === "respondida" && c.estado !== "respondida") return false;
  if (filtro === "tuyas" && !tieneMia(c.id)) return false;
  if (!busca) return true;
  const t = (c.id + " " + c.tema + " " + c.titulo + " " + plano(c.cuerpo) + " " + c.opciones.map(o => plano(o[1])).join(" ")).toLowerCase();
  return busca.split(/\s+/).every(p => t.includes(p));
}

function ficha(c){
  const m = mias[c.id] || {};
  const tuya = tieneMia(c.id);
  const ops = c.opciones.map(o => `
    <label class="op${m.opcion === o[0] ? " marcada" : ""}">
      <input type="radio" name="op-${c.id}" id="op-${c.id}-${o[0]}" value="${o[0]}"${m.opcion === o[0] ? " checked" : ""}>
      <span><b>${o[0]})</b> ${o[1]}${o[2] ? '<span class="def">por defecto</span>' : ""}</span>
    </label>`).join("");
  const elegir = `
    <div class="elige">
      ${ops ? '<span class="et">Elegí una opción</span>' + ops : '<span class="et">Tu respuesta</span>'}
      <textarea id="tx-${c.id}" placeholder="${ops ? "Otra respuesta, matiz o comentario (opcional)" : "Escribí tu respuesta"}">${esc(m.texto || "")}</textarea>
      <div class="pie"><span id="st-${c.id}">${tuya ? "Guardada" + (m.fecha ? " · " + new Date(m.fecha).toLocaleString("es-AR", {dateStyle:"short", timeStyle:"short"}) : "") : ""}</span>
      ${tuya ? `<button type="button" data-borrar="${c.id}">Borrar mi respuesta</button>` : ""}</div>
    </div>`;
  const estado = tuya ? "tuya" : c.estado;
  const etEstado = {pendiente:"sin respuesta", respondida:"respondida", reemplazada:"reemplazada", tuya:"contestada acá"}[estado];
  const ya = c.respuesta ? `<div class="resp"><span class="et">Respuesta</span>${c.respuesta}</div>` : "";
  const hecho = c.hecho.length ? `<div class="hecho"><span class="et">${c.estado === "pendiente" ? "Mientras tanto hicimos" : "Lo que se hizo"}</span>${c.hecho.join("")}</div>` : "";
  const cuerpoElegir = c.estado === "pendiente" || tuya ? elegir
    : `<details class="cambiar"><summary>Cambiar la respuesta</summary>${elegir}</details>`;
  return `<article class="ficha ${estado}" id="${c.id}" data-id="${c.id}">
    <div class="cab"><span class="num">${c.id}</span><span class="tema">${esc(c.tema)}</span><span class="estado ${estado}">${etEstado}</span></div>
    <h2>${esc(c.titulo)}</h2>
    ${c.cuerpo ? `<div class="cuerpo">${c.cuerpo}</div>` : ""}
    ${ya}${hecho}${cuerpoElegir}
  </article>`;
}

function pintar(){
  resumen();
  const vis = CONSULTAS.filter(visible);
  $("#lista").innerHTML = vis.length ? vis.map(ficha).join("")
    : `<p class="vacio">${filtro === "tuyas" ? "Todavía no contestaste ninguna acá. Elegí una opción en «Pendientes» y queda guardada." : "No hay consultas con ese filtro."}</p>`;
}

// Guardado: una escritura por consulta a la vez; la última gana.
const enCurso = {}, pendiente = {};
async function guardar(id){
  const m = mias[id];
  try { localStorage.setItem(LS, JSON.stringify(mias)); } catch (e) {}
  const st = document.getElementById("st-" + id);
  if (!col) { if (st) st.textContent = "Guardada en este navegador"; resumen(); return; }
  if (enCurso[id]) { pendiente[id] = true; return; }
  enCurso[id] = true;
  if (st) st.textContent = "Guardando…";
  try {
    if (m && (m.opcion || (m.texto || "").trim())) await col.doc(id).set({opcion: m.opcion || "", texto: m.texto || "", fecha: m.fecha});
    else await col.doc(id).delete();
    if (st) st.textContent = m ? "Guardada" : "";
  } catch (e) {
    if (st) st.textContent = "No se pudo guardar en línea (" + (e && e.code || "error") + "): quedó en este navegador; usá «Copiar mis respuestas».";
  }
  enCurso[id] = false;
  if (pendiente[id]) { pendiente[id] = false; guardar(id); }
  resumen();
}

const timers = {};
document.addEventListener("change", e => {
  const r = e.target;
  if (r.type !== "radio") return;
  const id = r.name.slice(3);
  mias[id] = Object.assign({}, mias[id], {opcion: r.value, fecha: new Date().toISOString()});
  r.closest(".elige").querySelectorAll(".op").forEach(l => l.classList.toggle("marcada", l.contains(r)));
  guardar(id);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (!t.id || !t.id.startsWith("tx-")) return;
  const id = t.id.slice(3);
  mias[id] = Object.assign({}, mias[id], {texto: t.value, fecha: new Date().toISOString()});
  const st = document.getElementById("st-" + id); if (st) st.textContent = "Escribiendo…";
  clearTimeout(timers[id]); timers[id] = setTimeout(() => guardar(id), 1200);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-borrar]");
  if (b) { const id = b.dataset.borrar; delete mias[id]; guardar(id).then(pintar); return; }
  const f = e.target.closest(".filtros button");
  if (f) { filtro = f.dataset.f; document.querySelectorAll(".filtros button").forEach(x => x.setAttribute("aria-pressed", x === f)); pintar(); }
});
$("#buscar").addEventListener("input", e => { busca = e.target.value.trim().toLowerCase(); pintar(); });

$("#copiar").addEventListener("click", async () => {
  const lineas = CONSULTAS.filter(c => tieneMia(c.id)).map(c => {
    const m = mias[c.id], o = c.opciones.find(x => x[0] === m.opcion);
    return `${c.id} · ${c.titulo}: ${o ? o[0] + ") " + plano(o[1]) : ""}${(m.texto || "").trim() ? (o ? " — " : "") + m.texto.trim() : ""}`;
  });
  const txt = lineas.length ? lineas.join("\n") : "Todavía no hay respuestas.";
  const area = $("#copia");
  try { await navigator.clipboard.writeText(txt); $("#copiar").textContent = "¡Copiadas!"; area.hidden = true; }
  catch (e) { area.value = txt; area.hidden = false; area.select(); $("#copiar").textContent = "Seleccioná y copiá"; }
  setTimeout(() => $("#copiar").textContent = "Copiar mis respuestas", 2500);
});

pintar();

// Base del artifact: lo que elegís queda guardado y Claude lo lee para pasarlo a CONSULTAS.md.
(async () => {
  const aviso = $("#aviso");
  const corte = setTimeout(() => { if (!col) aviso.textContent = "Sin conexión al guardado: tus respuestas quedan en este navegador. Usá «Copiar mis respuestas» y pegalas en el chat."; }, 10000);
  try { db = window.claude && await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { clearTimeout(corte); aviso.textContent = "Tus respuestas quedan en este navegador. Usá «Copiar mis respuestas» y pegalas en el chat."; return; }
  col = db.collection("respuestas");
  col.onSnapshot(snap => {
    clearTimeout(corte);
    const remotas = {};
    snap.docs.forEach(d => { const v = d.data(); if (v && VIGENTES.has(d.id)) remotas[d.id] = v; });
    // Lo local que todavía no subió se sube; lo remoto manda en lo demás.
    const subir = Object.keys(mias).filter(id => !remotas[id] || (mias[id].fecha || "") > (remotas[id].fecha || ""));
    mias = Object.assign({}, remotas);
    try { const loc = JSON.parse(localStorage.getItem(LS) || "{}"); subir.forEach(id => { if (loc[id] && VIGENTES.has(id)) mias[id] = loc[id]; }); } catch (e) {}
    aviso.textContent = "Lo que elegís se guarda solo y Claude lo lee desde acá. También podés copiarlo y pegarlo en el chat.";
    const activo = document.activeElement && document.activeElement.id;
    if (!activo || !activo.startsWith("tx-")) pintar(); else resumen();
    subir.forEach(id => guardar(id));
  }, err => {
    clearTimeout(corte); col = null;
    aviso.textContent = "No se pudo leer el guardado (" + (err && err.code || "error") + "): tus respuestas quedan en este navegador; usá «Copiar mis respuestas».";
  });
})();
</script>
