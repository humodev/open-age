<title>Consultas de Raíces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Una columna de fichas, como un cuaderno de consultas: contexto, lo que se hizo, tu elección. */
:root{
  --bg:#f1f2ec; --hoja:#fbfbf7; --tinta:#1e2621; --suave:#5a665e; --linea:#d8dccf;
  --acento:#1f6a5f; --acento-suave:#e1eeea; --ocre:#9a5a16; --ocre-suave:#f6ead9;
  --pend:#a3610f; --ok:#2f7a3c; --gris:#7a8178;
  --f-titulo:"Alegreya",Georgia,serif; --f-texto:"Alegreya Sans",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151a17; --hoja:#1d2420; --tinta:#e6eae2; --suave:#a3ada5; --linea:#323b35;
  --acento:#6cc2b3; --acento-suave:#1f3631; --ocre:#e0a35a; --ocre-suave:#3a2c1b;
  --pend:#e0a35a; --ok:#79c48a; --gris:#8d958c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a17; --hoja:#1d2420; --tinta:#e6eae2; --suave:#a3ada5; --linea:#323b35;
  --acento:#6cc2b3; --acento-suave:#1f3631; --ocre:#e0a35a; --ocre-suave:#3a2c1b;
  --pend:#e0a35a; --ok:#79c48a; --gris:#8d958c; color-scheme:dark}
body{background:var(--bg);color:var(--tinta);font:17px/1.5 var(--f-texto);padding-inline:16px;padding-block:0 64px}
.marco{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--linea);display:grid;gap:10px}
h1{font:700 1.7rem/1.1 var(--f-titulo);margin:0;text-wrap:balance}
.resumen{color:var(--suave);font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.resumen b{color:var(--tinta)}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filtros{display:flex;gap:4px;flex-wrap:wrap}
.filtros button{font:500 .9rem var(--f-texto);border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);border-radius:999px;padding:4px 12px;cursor:pointer}
.filtros button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:var(--hoja)}
input[type=search]{flex:1 1 180px;min-width:0;font:inherit;font-size:.95rem;padding:5px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--hoja);color:var(--tinta)}
.copiar{font:700 .9rem var(--f-texto);background:var(--ocre);color:var(--hoja);border:0;border-radius:8px;padding:6px 14px;cursor:pointer}
.aviso{font-size:.85rem;color:var(--suave)}
main{display:grid;gap:18px;padding-top:18px}
.ficha{background:var(--hoja);border:1px solid var(--linea);border-radius:10px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.ficha.pendiente{border-left:4px solid var(--pend)}
.ficha.tuya{border-left:4px solid var(--acento)}
.cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.num{font:500 .8rem var(--f-mono);color:var(--suave)}
.tema{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--suave)}
.estado{margin-left:auto;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.estado.pendiente{color:var(--pend)} .estado.respondida{color:var(--ok)} .estado.reemplazada{color:var(--gris)} .estado.tuya{color:var(--acento)}
h2{font:600 1.25rem/1.25 var(--f-titulo);margin:0;text-wrap:balance}
.cuerpo{color:var(--tinta);min-width:0;overflow-wrap:anywhere}
.cuerpo p,.hecho p,.resp p{margin:0 0 6px}
.cuerpo ul,.hecho ul{margin:0 0 6px;padding-left:20px}
code{font:500 .82em var(--f-mono);background:var(--acento-suave);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.hecho{background:var(--ocre-suave);border-radius:8px;padding:10px 12px;font-size:.95rem}
.hecho .et,.resp .et,.elige .et{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ocre);margin-bottom:4px}
.resp{background:var(--acento-suave);border-radius:8px;padding:10px 12px;font-size:.95rem}
.resp .et{color:var(--acento)}
.elige{display:grid;gap:6px}
.elige .et{color:var(--acento)}
.op{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;cursor:pointer}
.op:hover{border-color:var(--acento)}
.op input{margin-top:5px;accent-color:var(--acento);flex:none}
.op span{min-width:0}
.op.marcada{border-color:var(--acento);background:var(--acento-suave)}
.def{font-size:.72rem;font-weight:700;color:var(--ocre);text-transform:uppercase;letter-spacing:.05em;margin-left:6px;white-space:nowrap}
textarea{font:inherit;font-size:.95rem;width:100%;box-sizing:border-box;min-height:64px;padding:8px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--bg);color:var(--tinta);resize:vertical}
.pie{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--suave)}
.pie button{font:500 .85rem var(--f-texto);background:none;border:1px solid var(--linea);color:var(--suave);border-radius:6px;padding:3px 10px;cursor:pointer}
details.cambiar>summary{cursor:pointer;color:var(--acento);font-size:.9rem;font-weight:500}
details.cambiar[open]>summary{margin-bottom:8px}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.vacio{color:var(--suave);text-align:center;padding:40px 0}
#copia{width:100%;min-height:140px}
@media (prefers-reduced-motion:no-preference){.op,.filtros button{transition:background .15s,border-color .15s}}
</style>

<div class="marco">
<header>
  <h1>Consultas de Raíces</h1>
  <div class="resumen" id="resumen"></div>
  <div class="barra">
    <div class="filtros" role="group" aria-label="Filtrar">
      <button type="button" data-f="pendiente" aria-pressed="true">Pendientes</button>
      <button type="button" data-f="tuyas" aria-pressed="false">Contestadas acá</button>
      <button type="button" data-f="respondida" aria-pressed="false">Ya respondidas</button>
      <button type="button" data-f="todas" aria-pressed="false">Todas</button>
    </div>
    <input type="search" id="buscar" placeholder="Buscar (yerba, sonido, C-69…)" aria-label="Buscar">
    <button type="button" class="copiar" id="copiar">Copiar mis respuestas</button>
  </div>
  <div class="aviso" id="aviso">Conectando con el guardado…</div>
  <textarea id="copia" hidden readonly aria-label="Tus respuestas en texto"></textarea>
</header>
<main id="lista"></main>
</div>

<script>
const CONSULTAS = [{"id": "C-01", "titulo": "Nombre del juego (A-005)", "cuerpo": "", "opciones": [["a", "Proyecto Sur", true], ["b", "Tierra Adentro", false], ["c", "Raíces", false], ["d", "Otro: escribilo", false]], "respuesta": "<p>c) <strong>Raíces<\/strong> (2026-11-13). Aplicado: el juego se llama Raíces en el menú, el proyecto, el README y los documentos (D-029).<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-02", "titulo": "Civilizaciones nuevas", "cuerpo": "<p>Elegí Quilombo dos Palmares (Brasil) y Ayutthaya (Siam). ¿Te van?<\/p>", "opciones": [["a", "Sí", true], ["b", "Cambiar Palmares por tupinambá", false], ["c", "Cambiar Ayutthaya por maratas (India)", false]], "respuesta": "<p>a) Están bien (2026-11-13).<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-03", "titulo": "Imágenes generadas por IA", "cuerpo": "<p>Para retratos y láminas de campaña puedo usar generación de imágenes, o quedarme con arte procedural y libre (CC0).<\/p>", "opciones": [["a", "Solo procedural y CC0", true], ["b", "Generadas por IA, marcadas como tales", false]], "respuesta": "<p>b, con Meshy (respondido en el chat el 2026-11-13). Se usa con un tope de unos 400 créditos; ver C-05.<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-04", "titulo": "Música", "cuerpo": "<p>Si no aparece música libre que suene a estas regiones:<\/p>", "opciones": [["a", "Solo ambiente y efectos, sin música", true], ["b", "Música procedural simple generada por el juego", false]], "respuesta": "<p>\"Consigamos lo que podamos\". Se busca más música libre que suene a cada región; el autor va a opinar cuando escuche lo que hay.<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-05", "titulo": "Presupuesto de Meshy", "cuerpo": "<p>El saldo (1.442 créditos) se comparte con apex-open. Usé hasta unos 400: láminas de civilización y de campaña, más los modelos 3D clave. ¿Gasto más para modelar todas las unidades y edificios?<\/p>", "opciones": [["a", "No, con eso alcanza", true], ["b", "Sí, hasta ___ créditos más", false]], "respuesta": "<p>\"Gastá lo necesario, de la forma más eficiente posible; los créditos se renuevan una vez al mes\" (2026-11-13).<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-06", "titulo": "¿Terreno ahora o cerrar pendientes?", "cuerpo": "", "opciones": [["a", "Arrancar ya con el plan de terreno y mapas (<code>docs/10<\/code>)", false], ["b", "Cerrar antes balance e IA", false]], "respuesta": "<p>a) \"Continuá acorde al plan con todo el trabajo\" (2026-11-13). Etapa 10 en <code>proceso/<\/code>.<\/p>", "hecho": [], "estado": "respondida", "tema": "general"}, {"id": "C-07", "titulo": "¿Aceptamos música con licencia CC BY-SA?", "cuerpo": "<p>Hay buenas grabaciones de siku y sikuri para Tawantinsuyu en Wikimedia, pero son CC BY-SA. Esa licencia obliga a dar crédito y a compartir con la misma licencia cualquier cambio que se haga a la pista, no al juego. Hoy solo se usa CC0 y dominio público.<\/p>", "opciones": [["a", "Sí, con crédito", true], ["b", "No, solo CC0", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, con crédito<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-08", "titulo": "La pifilka mapuche tiene uso ceremonial (ngillatun)", "cuerpo": "<p>Las grabaciones las publicó el propio intérprete en dominio público, pero suenan en el combate.<\/p>", "opciones": [["a", "Dejarla solo en el menú o en la paz, no en el combate", true], ["b", "Dejarla como está", false], ["c", "Sacarla", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarla solo en el menú o en la paz, no en el combate<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-09", "titulo": "¿Quedaron bien la escala y la velocidad?", "cuerpo": "<p>Ahora una casa mide unas tres veces un aldeano y todos andan un 10 % más lento. Para probarlo, jugá a velocidad ×1, no con el autotest, que corre a ×4.<\/p>", "opciones": [["a", "Están bien", false], ["b", "Aldeanos todavía grandes", false], ["c", "Todavía rápidos", false], ["d", "Ahora demasiado lentos", false]], "respuesta": "", "hecho": ["<p>No tiene opción por defecto: queda como está hasta que contestes.<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-10", "titulo": "Modelo de la riqueza (resumen en `docs/diseno/revision-economia/00-sintesis.md`)", "cuerpo": "", "opciones": [["a", "\"Una riqueza, seis motores\": un solo recurso, con nombre e ícono por civ, y que cada civ produce con su propio motor pacífico desde la edad I", true], ["b", "Solo cambiar la imagen y los nombres, sin tocar las reglas", false], ["c", "Un cuarto recurso distinto para cada civ", false]], "respuesta": "", "hecho": ["<p>Reemplazada por C-14 a C-20 (diseño final de la economía, ronda 3).<\/p>"], "estado": "reemplazada", "tema": "general"}, {"id": "C-11", "titulo": "¿Qué hay junto a cada base?", "cuerpo": "", "opciones": [["a", "Una salina chica que se agota, más el paisaje propio de la civ; nada dorado", true], ["b", "Dejar los dos yacimientos, pero con otro aspecto", false], ["c", "Nada común: solo el motor propio", false]], "respuesta": "", "hecho": ["<p>Reemplazada por C-14 a C-20 (diseño final de la economía, ronda 3).<\/p>"], "estado": "reemplazada", "tema": "general"}, {"id": "C-12", "titulo": "Kulliñ mapuche", "cuerpo": "", "opciones": [["a", "El kulliñ pasa a ser la riqueza mapuche: el ganado crece en el corral y el botín que supera el tope se vuelve riqueza", true], ["b", "Mantenerlos separados, como hoy", false]], "respuesta": "", "hecho": ["<p>Reemplazada por C-14 a C-20 (diseño final de la economía, ronda 3).<\/p>"], "estado": "reemplazada", "tema": "general"}, {"id": "C-13", "titulo": "¿Arranco ya con los arreglos \"sin arrepentimiento\"?", "cuerpo": "<p>Son la IA mapuche, la campana, la vida de los edificios mapuches, el costo del gult, los colores y el tooltip de riqueza. Valen para cualquier modelo.<\/p>", "opciones": [["a", "Sí, mientras decidís el resto", true], ["b", "No, esperá", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, mientras decidís el resto<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-14", "titulo": "¿Cómo medimos que el esfuerzo sea parejo?", "cuerpo": "", "opciones": [["a", "Umbrales absolutos: como máximo 0,6 órdenes por minuto y 2 pendientes cada 10 minutos por civ, y ninguna por encima de 1,5 veces la mediana", true], ["b", "×1,5 entre la que más y la que menos pide (falla porque guaraníes y Palmares piden muy poco)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Umbrales absolutos: como máximo 0,6 órdenes por minuto y 2 pendientes cada 10 minutos por civ, y ninguna por encima de 1,5 veces la mediana<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-15", "titulo": "Costo del avance a la edad II", "cuerpo": "", "opciones": [["a", "500 de alimento + 300 de riqueza, y se mide con la IA real; si pasa de los 9:00, vuelve a 400 + 250", true], ["b", "Dejarlo en 400 + 200 (algunas civs llegan antes de los 6:30)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) 500 de alimento + 300 de riqueza, y se mide con la IA real; si pasa de los 9:00, vuelve a 400 + 250<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-16", "titulo": "Cuando se acaba la arcilla de casa (minutos 13 a 24), el ingreso de riqueza cae a la mitad", "cuerpo": "", "opciones": [["a", "Aceptarlo: el final se pelea en el centro, con tope", true], ["b", "Agregar una veta lenta en el flanco", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Aceptarlo: el final se pelea en el centro, con tope<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-17", "titulo": "Etiopía en escaramuza: ¿la corte \"se funda\" en otro lugar en vez de viajar como carpa?", "cuerpo": "", "opciones": [["a", "Sí: sin carpa vulnerable ni derrota por empacar; la carpa queda para la campaña", true], ["b", "Volver a la carpa que viaja", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí: sin carpa vulnerable ni derrota por empacar; la carpa queda para la campaña<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-18", "titulo": "¿Ayutthaya sin depósitos comunes, con el elefante del rey como depósito?", "cuerpo": "", "opciones": [["a", "Sí", true], ["b", "Que pueda construir depósitos comunes", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-19", "titulo": "Mapuches: si pierden la arcilla de casa en el minuto 10, conservan el 29 % del ingreso de riqueza (no atrasan la edad)", "cuerpo": "", "opciones": [["a", "Aceptarlo como el precio de \"no hay capital\" y mirarlo en el torneo", true], ["b", "Abaratar el lof de flanco de 110 a 80 de madera", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Aceptarlo como el precio de \"no hay capital\" y mirarlo en el torneo<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-20", "titulo": "Cambiar las frases de Palmares (\"se esconde\") y Ayutthaya (\"comercia con el mundo\"), que contradicen el diseño", "cuerpo": "", "opciones": [["a", "Sí, con las propuestas de la sección 11 del diseño final", true], ["b", "Dejarlas", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, con las propuestas de la sección 11 del diseño final<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-21", "titulo": "¿La IA \"Pacífica\" puede ganar por sitios sagrados?", "cuerpo": "<p>Hoy controla el mapa y toma sitios, así que puede ganar por ellos sin atacarte.<\/p>", "opciones": [["a", "Sí, es parte de su juego: los sitios hay que disputarlos", true], ["b", "No: toma sitios pero no cuenta para su victoria", false], ["c", "No toma sitios", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, es parte de su juego: los sitios hay que disputarlos<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-22", "titulo": "Misión mapuche 2: se arranca con población 33/8", "cuerpo": "<p>El malón trae 10 aldeanos y 22 guerreros con un lof que da 8 de tope. Hoy se explica con un aviso al empezar (\"hay más gente que lugar: construí casas\"). El motor de escenarios no puede dar casas al jugador.<\/p>", "opciones": [["a", "Dejarlo explicado: es un malón, no hace falta entrenar", true], ["b", "Que el motor de escenarios pueda dar rukas al jugador desde los datos de la misión", false], ["c", "Bajar las tropas iniciales hasta entrar en el tope", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarlo explicado: es un malón, no hace falta entrenar<\/p>"], "estado": "pendiente", "tema": "interfaz, parte B"}, {"id": "C-23", "titulo": "Paleta apta para daltonismo: ¿rojo de equipo puro y alimento frambuesa?", "cuerpo": "<p>Para que equipos y recursos se distingan también con daltonismo (<code>proceso/17-interfaz-segunda-tanda/01-escala-paleta-opciones.md<\/code>, paso 2), el jugador 2 pasó de rojo terracota a rojo puro, el alimento de rojo a frambuesa y la riqueza de dorado a amarillo dorado. Los equipos 3 y 4 son violeta y ciruela (antes verde y ocre).<\/p>", "opciones": [["a", "Dejarlo así", true], ["b", "Volver al terracota para el jugador 2 aunque se confunda con el alimento (ΔE 11)", false], ["c", "Otra combinación (decir cuál)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarlo así<\/p>"], "estado": "pendiente", "tema": "interfaz, parte A"}, {"id": "C-24", "titulo": "Música para Etiopía: no hay grabaciones CC0 ni de dominio público (etapa 19)", "cuerpo": "<p>Se revisaron Wikimedia Commons, Internet Archive (también la colección de discos de 78 rpm) y OpenGameArt; Freesound no permite descargar sin cuenta. Lo único etíope que apareció es CC-BY-SA (escala de begena, entrevistas de qene), está mal licenciado (discos comerciales subidos como CC0) o es un registro etnográfico o litúrgico (zema de estudiantes de Debre Libanos; Courlander, 1951; Leslau). Detalle en <code>proceso/19-arte-y-sonido/01-modelos-y-musica.md<\/code>.<\/p>", "opciones": [["a", "Seguir con las pistas genéricas hasta conseguir algo propio", true], ["b", "Encargar o grabar krar y masenqo con licencia propia", false], ["c", "Aceptar CC-BY-SA para la música (obliga a compartir esas pistas con la misma licencia)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Seguir con las pistas genéricas hasta conseguir algo propio<\/p>"], "estado": "pendiente", "tema": "arte"}, {"id": "C-25", "titulo": "Ayutthaya y el almacén de arcilla", "cuerpo": "<p>La economía v3 dice que Ayutthaya no construye depósito: todo lo cobra el elefante. Tu ejemplo del almacén de arcilla junto a la arcilla le cabe justo. Propuesta: darle el <em>khlang din<\/em> (almacén solo de arcilla), sin tocar el cobro del elefante (<code>docs/diseno/jugabilidad/03-propuesta.md<\/code> §2.2).<\/p>", "opciones": [["a", "Darle el khlang din", true], ["b", "Dejarla sin almacenes", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Darle el khlang din<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-26", "titulo": "Mapuches: el lof como único almacén", "cuerpo": "<p>Los mapuches no levantarían almacenes baratos por recurso: llevan todo al lof (la comunidad familiar). Es parte de su identidad móvil, y además les baja el 68 % del torneo.<\/p>", "opciones": [["a", "El lof como único almacén", true], ["b", "Darles almacenes como al resto", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El lof como único almacén<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-27", "titulo": "Orden de la formación", "cuerpo": "<p>AoE4 pone la caballería adelante. La propuesta pone adelante la línea (lanceros), después el choque, la distancia y el asedio, y a los montados en las alas, siguiendo nuestro triángulo de contadores (D-007).<\/p>", "opciones": [["a", "Nuestro orden", true], ["b", "Como AoE4", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Nuestro orden<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-28", "titulo": "¿Desde qué distancia los aldeanos van en bloque?", "cuerpo": "<p>Hasta 16 casillas cada aldeano va por su cuenta, corriendo al trabajo. Más lejos van en bloque y se esperan, y se sueltan a 6 casillas del destino. El 16 sale de que los recursos de casa están entre 7 y 15 casillas del centro. Se cambia en el dato.<\/p>", "opciones": [["a", "16 casillas", true], ["b", "Menos, para ver el bloque también en viajes medianos (decir cuánto)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) 16 casillas<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-29", "titulo": "El ariete frena al ejército", "cuerpo": "<p>Con velocidad común, un ejército con ariete marcha a la velocidad del ariete (un 47 % más lento que los lanceros), como en AoE4.<\/p>", "opciones": [["a", "Aceptarlo y medir", true], ["b", "Que el asedio marche aparte", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Aceptarlo y medir<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-30", "titulo": "Nombres en lenguas originarias sin fuente", "cuerpo": "<p>La propuesta nombra almacenes y edificios militares de cada pueblo, y algunos nombres están marcados <code>[verificar]<\/code> porque no se encontró fuente.<\/p>", "opciones": [["a", "Ponerlos y corregir cuando aparezca la fuente", true], ["b", "Usar nombres en castellano hasta tener fuente", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Ponerlos y corregir cuando aparezca la fuente<\/p>"], "estado": "pendiente", "tema": "jugabilidad"}, {"id": "C-31", "titulo": "Contadores más blandos para que la micro pague", "cuerpo": "<p>Hoy un contador multiplica el daño por 2 o por 2,25. El jugador veterano midió que 10 guerreros le ganan a 10 honderos perdiendo una sola unidad, y que kitear o concentrar el fuego no cambia nada (<code>proceso/22-testers/01-veterano-aoe4.md<\/code>). En AoE4 los bonos son más chicos y la micro decide más.<\/p>", "opciones": [["a", "Bajar a ×1,5–×1,75 y rebalancear con torneo", true], ["b", "Dejar los contadores fuertes: la composición decide, no la micro", false]], "respuesta": "<p>a) Sí, como AoE4: bonos planos por clase y armadura separada contra cuerpo a cuerpo y contra distancia (2026-11-15: \"Me gustó todo lo sugerido para hacerlo más como AoE4, vayamos por ahí, siempre manteniendo identidad del sur global y las peculiaridades de cada civ\"). Etapa 23.<\/p>", "hecho": [], "estado": "respondida", "tema": "jugadores de prueba"}, {"id": "C-32", "titulo": "Comida temprana con decisiones", "cuerpo": "<p>La edad I tiene 8 arbustos y nada más: no hay caza ni ganado, las granjas llegan a los 4 minutos (en AoE4, entre los 7 y los 10) y el explorador no tiene trabajo. Propuesta: animales que el explorador arrea (llamas, guanacos, cabras, búfalos según el pueblo y el terreno) y caza mayor que se defiende.<\/p>", "opciones": [["a", "Sí, con animales propios de cada región", true], ["b", "No: la edad I corta es una decisión del juego", false]], "respuesta": "<p>a) Sí: animales por región para arrear y caza que pelea, como las ovejas, ciervos y jabalíes de AoE4 (2026-11-15). Etapa 23.<\/p>", "hecho": [], "estado": "respondida", "tema": "jugadores de prueba"}, {"id": "C-33", "titulo": "Tiempo de obra de los hitos", "cuerpo": "<p>Un hito se levanta en 41–53 s con tres constructores; en AoE4 son unos 190 s. Así no hay ventana de riesgo y no importa dónde se pone.<\/p>", "opciones": [["a", "Subir a 120–150 s y medir las edades de nuevo", true], ["b", "Dejarlo rápido", false]], "respuesta": "<p>a) Sí: obra de los hitos como AoE4 (190/220/250 s) y auras que dependen del lugar (2026-11-15). Etapa 23.<\/p>", "hecho": [], "estado": "respondida", "tema": "jugadores de prueba"}, {"id": "C-34", "titulo": "¿Qué va primero?", "cuerpo": "<p>La síntesis (<code>proceso/22-testers/00-sintesis.md<\/code>) ordena: 1) errores que arruinan partidas (sitios faltantes, fortines sin peleas, aliado que no defiende, IA fácil, tutorial trabado); 2) sensación de juego (contadores, comida temprana, hitos); 3) aprender a jugar; 4) identidad (rivales propios, voces, aspecto por edad); 5) partidas de varios.<\/p>", "opciones": [["a", "Ese orden", true], ["b", "Otro (decir cuál)", false]], "respuesta": "<p>a) Ese orden, en dirección AoE4 sin perder la identidad de cada pueblo (2026-11-15). Plan en <code>proceso/23-como-aoe4<\/code>.<\/p>", "hecho": [], "estado": "respondida", "tema": "jugadores de prueba"}, {"id": "C-35", "titulo": "Teclas de los marcadores de cámara", "cuerpo": "<p>AoE4 guarda la cámara con Ctrl + F1…F8. Acá F1–F6 abren los paneles y F10 es la pausa, así que los marcadores quedaron en Ctrl + F7…F9 (tres). Detalle en <code>proceso/23-como-aoe4/02-ordenes-y-comodidades.md<\/code>.<\/p>", "opciones": [["a", "Dejar F7–F9", true], ["b", "Pasar los paneles a otras teclas y usar F1–F4 para la cámara, como AoE4", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejar F7–F9<\/p>"], "estado": "pendiente", "tema": "órdenes"}, {"id": "C-36", "titulo": "¿Cuánto da la IA aliada cuando le piden?", "cuerpo": "<p>Hoy da 200 si después le quedan 300 (<code>reglas.json → equipos.pedido<\/code>), y a una bengala manda la mitad de su ejército libre, con un mínimo de 3 (<code>equipos.bengala<\/code>). Un aliado muy generoso se queda sin ejército; uno muy tacaño parece que no escucha.<\/p>", "opciones": [["a", "Así", true], ["b", "Más generosa (todo lo que le sobre, el ejército entero)", false], ["c", "Más prudente (solo si no la están atacando)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "órdenes"}, {"id": "C-37", "titulo": "¿Con qué pueblo se aprende?", "cuerpo": "<p>El tutorial usa a los guaraníes, que no tienen torre, granero ni depósito, y cuyos edificios tienen nombre propio (Oga, Aty, Kokue). El jugador nuevo pidió aprender con un pueblo \"más normal\" (<code>proceso/22-testers/02-nuevo-en-rts.md<\/code>).<\/p>", "opciones": [["a", "Dejar a los guaraníes: los nombres propios con el común debajo ya se entienden", true], ["b", "Pasar el tutorial a Tawantinsuyu, que tiene todos los edificios comunes", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejar a los guaraníes: los nombres propios con el común debajo ya se entienden<\/p>"], "estado": "pendiente", "tema": "aprender a jugar"}, {"id": "C-38", "titulo": "\"Arte de la guerra\"", "cuerpo": "<p>AoE4 tiene misiones cortas de una sola idea (economía temprana, defensa, contadores, sitios, asedio) con medalla de bronce, plata y oro. El motor de escenarios ya alcanza para hacerlas (objetivos <code>juntar<\/code>, <code>sitio<\/code>, cuentas y ataques con aviso).<\/p>", "opciones": [["a", "Sí, cinco misiones cortas con medallas por tiempo, después de la etapa 23", true], ["b", "No por ahora", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, cinco misiones cortas con medallas por tiempo, después de la etapa 23<\/p>"], "estado": "pendiente", "tema": "aprender a jugar"}, {"id": "C-39", "titulo": "Nombre de la edad IV del Tawantinsuyu: \"Inkarri\"", "cuerpo": "<p>El mito de Inkarrí se documenta sobre todo en el siglo XX (Arguedas lo recogió en Puquio en 1956), aunque se lo vincula con el Taki Onqoy y con la muerte de Túpac Amaru I (1572). La edad IV cubre Vilcabamba (1537–1572) y Tinta (1780). Ya la investigación lo había dejado como \"a consultar\" (<code>docs/investigacion/tawantinsuyu.md<\/code>, punto 9). Sus dos hitos son Qorikancha y Vilcabamba.<\/p>", "opciones": [["a", "Dejar Inkarri y explicarlo en el panel del pueblo como un guiño al arco de la campaña, no como un nombre de época", true], ["b", "<em>Vilcabamba<\/em> (choca con el nombre del hito militar)", false], ["c", "<em>Neo Inka<\/em>", false], ["d", "Otro (escribilo)", false]], "respuesta": "", "hecho": ["<p>Los historiadores proponen <em>Willkapampa<\/em> en C-70; contestar C-70 alcanza.<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-40", "titulo": "El Qorikancha como hito de la edad IV inca", "cuerpo": "<p>El Qorikancha lo reconstruyó Pachakutiq hacia 1438: como obra de la última edad es anacrónico. Moverlo a la edad II o III cambia los hitos y, por lo tanto, el balance del Tawantinsuyu, que está en revisión (parte A).<\/p>", "opciones": [["a", "Cambiarle el nombre a la opción económica de la edad IV (por ejemplo, <em>Wak'a rehenes<\/em> o <em>Huacas del Cusco<\/em>), sin tocar sus números", true], ["b", "Pasarlo a la edad III y llevar el aqllawasi o la kallanka real a la IV (rebalancea)", false], ["c", "Dejarlo así", false]], "respuesta": "", "hecho": ["<p>Los historiadores proponen la b) en C-70.<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-41", "titulo": "Orden de las edades guaraníes y \"Amundá\"", "cuerpo": "<p>Los datos dicen <em>Tekoha → Amundá → Mbororé → Tava<\/em>. La investigación propone <em>Tekoha → cuñadazgo y conquista → Tava o monte → Mbororé y Guerra Guaranítica<\/em> (<code>docs/investigacion/guaranies.md<\/code>, \"Periodización\"). En los datos, la bifurcación misión o monte está en el avance a la III y los hitos de la IV (<em>Tava fortificada<\/em> y <em>Ñande retã<\/em>) son de la Guerra Guaranítica, así que el orden de los datos tiene lógica, pero termina en \"Tava\" y se lee como si la meta fuera reducirse. Además, <strong>\"Amundá\" no tiene fuente ni explicación<\/strong> en ningún documento.<\/p>", "opciones": [["a", "<em>Tekoha → Tovaja (cuñadazgo) → Mbororé → Ñande retã<\/em> (la III es la de Mbororé, 1641, y la IV, la de 1754–1756)", true], ["b", "Seguir la investigación: III <em>Tava ha ka'aguy<\/em> (pueblo y monte), IV <em>Mbororé<\/em>", false], ["c", "Dejarlo así y explicarlo en el panel. En cualquier caso, ¿de dónde sale \"Amundá\"? [verificar <em>tovaja<\/em> con un hablante]", false]], "respuesta": "", "hecho": ["<p>Los historiadores proponen <em>Tekoha → Guára → Mbororé → Ñande retã<\/em> en C-70.<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-42", "titulo": "\"Cucaú o Quilombo\" como nombre de la edad IV de Palmares", "cuerpo": "<p>Se lee como una opción de menú, no como un nombre. La edad IV es la bifurcación entre el <em>Pacto de Cucaú<\/em> (Gana Zumba, 1678) y la <em>Guerra de Zumbi<\/em>, y esas ya son sus dos opciones de hito.<\/p>", "opciones": [["a", "Un solo nombre: <em>Macaco<\/em> (la cerca real de la Serra da Barriga, donde siguió Zumbi)", true], ["b", "<em>1678<\/em>", false], ["c", "<em>Angola Janga<\/em> para la IV y otro nombre para la III", false], ["d", "Dejarlo y explicar la bifurcación en el panel", false]], "respuesta": "", "hecho": ["<p>Los historiadores proponen la b) «1678» o la d) en C-70.<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-43", "titulo": "Palabras en portugués en los textos en castellano", "cuerpo": "<p>Cambié \"roças\" por \"rozas\", \"milho\" por \"maíz\" y \"farinha\" por \"fariña\" (castellano del litoral) en las campañas de Palmares y guaraníes, porque tienen palabra propia en castellano. Dejé las que nombran instituciones o lugares sin equivalente (<em>mocambo<\/em>, <em>quilombo<\/em>, <em>terço<\/em>, <em>morador<\/em>, <em>bandeira<\/em>). Queda \"la mata\" en Palmares (en castellano rioplatense, \"mata\" es un arbusto; sería \"el monte\").<\/p>", "opciones": [["a", "Ese criterio, y \"la mata\" pasa a \"el monte\"", true], ["b", "Volver al portugués de época, siempre en cursiva y con un glosario en el juego", false], ["c", "Ese criterio, pero \"la mata\" se queda (es la <em>mata atlántica<\/em>)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Ese criterio, y \"la mata\" pasa a \"el monte\"<\/p>"], "estado": "pendiente", "tema": "textos"}, {"id": "C-44", "titulo": "Rivales con civilización propia: ¿alcanza o separamos más?", "cuerpo": "<p>La parte D sumó seis civs solo de IA: Adal, Birmania (Toungoo y Konbaung juntos), chankas, caranquis y cayambes, cañaris y tupíes (<code>proceso/23-como-aoe4/04-rivales-propios.md<\/code>). Quedan con la civ del jugador las milicias de Pumakawa (incas), los señores de Lasta (etíopes) y los señores de Phitsanulok, Phimai y Fang (siameses), que sí son del mismo pueblo. Los holandeses, franceses, paulistas y la tropa de Jorge Velho siguen como <code>invasores<\/code>.<\/p>", "opciones": [["a", "Así", true], ["b", "Separar también a los europeos por potencia (Castilla, Portugal, Países Bajos, Francia), con nombres de edad propios en vez de <em>Virreinato<\/em> para todos", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-45", "titulo": "Recursos medios y altos", "cuerpo": "<p>Hoy son 500/500/300/300 y 1000/1000/700/700 (alimento, madera, piedra, riqueza), parecidos a los de AoE2 (<code>proceso/24-tras-la-segunda-ronda/4b-opciones-de-partida.md<\/code>).<\/p>", "opciones": [["a", "Esos", true], ["b", "Otros (decí cuáles)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Esos<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-46", "titulo": "Ubicación de los equipos por defecto", "cuerpo": "<p>Ahora el 2v2 y el 3v3 del menú arrancan con los aliados juntos, como el lobby de AoE4. Antes quedaban mezclados por el orden de los lugares.<\/p>", "opciones": [["a", "Juntos", true], ["b", "Mezclados", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Juntos<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-47", "titulo": "Empate al tiempo límite", "cuerpo": "<p>Si al cumplirse el tiempo los puntos empatan, hoy no gana nadie y la pantalla dice \"Empate\".<\/p>", "opciones": [["a", "Empate", true], ["b", "Desempate por edificios en pie o por sitios", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Empate<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-48", "titulo": "Conquista sin hitos: ¿cuentan las unidades?", "cuerpo": "<p>Con \"Hitos: no\", pierde quien se queda sin edificios terminados. No cuentan muros, puertas ni caminos; sí granjas, casas y almacenes.<\/p>", "opciones": [["a", "Solo edificios", true], ["b", "También las unidades, como algunos modos de AoE4 (se alarga la caza del último aldeano)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Solo edificios<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-49", "titulo": "Hitos apagados sin tiempo límite", "cuerpo": "<p>En 4 partidas de IA contra IA de hasta 45 minutos, sin hitos ni sitios, la IA nunca termina la conquista (al mapuche le quedaban 41 edificios).<\/p>", "opciones": [["a", "El menú sugiere un tiempo límite al apagar \"Hitos\", y la IA aprende a cazar los últimos edificios en el paso de la IA experta", true], ["b", "Solo mejorar la IA", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El menú sugiere un tiempo límite al apagar \"Hitos\", y la IA aprende a cazar los últimos edificios en el paso de la IA experta<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-50", "titulo": "Opciones del lobby de AoE4 que faltan", "cuerpo": "<p>Faltan maravilla (no existe todavía), edad inicial, población máxima y \"revelar mapa\".<\/p>", "opciones": [["a", "Población máxima y revelar mapa ahora; edad inicial y maravilla después", true], ["b", "Ninguna por ahora", false], ["c", "Todas", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Población máxima y revelar mapa ahora; edad inicial y maravilla después<\/p>"], "estado": "pendiente", "tema": "opciones de partida"}, {"id": "C-51", "titulo": "¿Tiene que ganarle a la difícil?", "cuerpo": "<p>La experta llega a 100 aldeanos a los 25 minutos en tres civs y levanta un segundo o tercer centro, pero contra la difícil pierde 2 de 6 partidas, gana 1 y 3 quedan abiertas a los 25 minutos. Su economía grande llega tarde: a los 10–15 minutos tiene igual o menos ejército (<code>proceso/24-tras-la-segunda-ronda/4a-ia-experta.md<\/code>).<\/p>", "opciones": [["a", "Otro paso de ajuste con torneo de la experta contra la difícil", true], ["b", "Dejarla así por ahora", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Otro paso de ajuste con torneo de la experta contra la difícil<\/p>"], "estado": "pendiente", "tema": "IA experta"}, {"id": "C-52", "titulo": "¿Cuenta para el balance?", "cuerpo": "<p>El torneo de balance se juega con la normal. Palmares no crece con centros sino con la fama, así que con la experta queda abajo por diseño.<\/p>", "opciones": [["a", "El balance se mide con la normal, y la experta solo se revisa para que ninguna civ quede inútil", true], ["b", "Sumar un torneo con la experta y balancear también ahí", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El balance se mide con la normal, y la experta solo se revisa para que ninguna civ quede inútil<\/p>"], "estado": "pendiente", "tema": "IA experta"}, {"id": "C-53", "titulo": "El kultrun en el juego", "cuerpo": "<p>El sonido mapuche (fanfarria, alarma y órdenes) usa kultrun y trutruka sintetizados (<code>proceso/24-tras-la-segunda-ronda/4g-sonido.md<\/code>). El kultrun es un instrumento ceremonial de la machi. Ya estaba pendiente consultar la pifilka.<\/p>", "opciones": [["a", "Dejarlo, y consultarlo con una organización mapuche junto con la pifilka antes de publicar", true], ["b", "Usar solo la trutruka hasta tener esa consulta", false]], "respuesta": "", "hecho": ["<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-54", "titulo": "La begena en la música de paz etíope", "cuerpo": "<p>La música nueva de Etiopía (C-24) abre y cierra con begena, el arpa de la oración ortodoxa. Solo suena en la paz, nunca en combate ni en alarmas, y no hay voces ni nada que imite el zema.<\/p>", "opciones": [["a", "Así, y consultarlo con alguien de la tradición ortodoxa etíope antes de publicar", true], ["b", "Reemplazar la begena por krar, que es profano", false]], "respuesta": "", "hecho": ["<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-55", "titulo": "El berimbau en Palmares", "cuerpo": "<p>El sonido de Palmares usa berimbau y atabaque. El berimbau de arco con calabaza está documentado en Brasil sobre todo desde el siglo XIX [verificar]; en el Palmares del siglo XVII podría ser un anacronismo.<\/p>", "opciones": [["a", "Dejarlo: es el instrumento afrobrasileño que más se reconoce", true], ["b", "Solo atabaque y agogô", false]], "respuesta": "", "hecho": ["<p>Mientras tanto se aplicó la opción b), la prudente (paso 4h, a pedido del jugador de historia en la ronda 3). Si contestás a), se vuelve: los modelos están en <code>456a59b<\/code>.<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-56", "titulo": "Mbaraka y takuapu guaraníes", "cuerpo": "<p>Son instrumentos rituales del opy mbyá. Desde el paso 4h no suenan en la tropa: en su lugar, mimby (flauta de caña) y angu'apu (tambor de tronco), según Montoya, 1639 [verificar].<\/p>", "opciones": [["a", "Así, hasta consultar con una organización mbyá", true], ["b", "Volver a la mbaraka", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así, hasta consultar con una organización mbyá<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-57", "titulo": "La música de paz de Palmares", "cuerpo": "<p>Tiene dos grabaciones de berimbau con toques de capoeira y una de ijexá (un ritmo del candomblé). El sonido de tropa ya es de raíz angoleña (paso 4h).<\/p>", "opciones": [["a", "Dejarlas hasta tener una música propia sintetizada de ngoma y marimba", true], ["b", "Sacarlas ya", false]], "respuesta": "", "hecho": ["<p>Aplicada la b) por la revisión histórica (etapa 25): la música de paz de Palmares quedó sin pistas propias. Si contestás a), se revierten dos líneas de <code>audio.gd<\/code>.<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-58", "titulo": "El kebero etíope en la fanfarria, la alarma y el entrenado", "cuerpo": "<p>El kebero también es tambor litúrgico [verificar]. La orden ya pasó al krar.<\/p>", "opciones": [["a", "Dejarlo y preguntarlo junto con C-54", true], ["b", "Sacarlo también de esos tres", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarlo y preguntarlo junto con C-54<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-59", "titulo": "*Phleng Maha Nimit* en la música de Ayutthaya", "cuerpo": "<p>Podría ser del repertorio ceremonial naphat [verificar].<\/p>", "opciones": [["a", "Dejarla hasta confirmar", true], ["b", "Sacarla", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarla hasta confirmar<\/p>"], "estado": "pendiente", "tema": "sonido"}, {"id": "C-60", "titulo": "La mbaraka del karai en el hito guaraní", "cuerpo": "<p>El hito \"Casa del karai\" muestra bastones con plumas y una mbaraka (<code>data/arte_hitos.json<\/code>).<\/p>", "opciones": [["a", "Dejarlo: es la casa del karai, donde corresponde", true], ["b", "Sacar la mbaraka del modelo", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Dejarlo: es la casa del karai, donde corresponde<\/p>"], "estado": "pendiente", "tema": "arte"}, {"id": "C-61", "titulo": "Un solo ataque", "cuerpo": "<p>La fácil tiene tope de 15 soldados, pero la segunda oleada pide 18 (12 + 6). Si la primera se traba, no vuelve a atacar y a veces la partida no termina (<code>proceso/24-tras-la-segunda-ronda/4j-jugador-nuevo-ronda-3.md<\/code>).<\/p>", "opciones": [["a", "Bajar el paso de la oleada de la fácil para que ataque varias veces, con oleadas chicas: el principiante tiene un segundo ataque que rechazar", true], ["b", "Subir su tope de ejército", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Bajar el paso de la oleada de la fácil para que ataque varias veces, con oleadas chicas: el principiante tiene un segundo ataque que rechazar<\/p>"], "estado": "pendiente", "tema": "IA fácil"}, {"id": "C-62", "titulo": "Captura que se vacía sola", "cuerpo": "<p>Hoy un sitio guarda lo que lleva de captura aunque el que lo toma se vaya, y varias pasadas cortas suman los 10 s. En AoE4, la captura se vacía de a poco sin nadie. Cambiaría la regla para todos y el balance.<\/p>", "opciones": [["a", "Que se vacíe de a poco, como AoE4, medido con torneo", true], ["b", "Dejarlo como está", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Que se vacíe de a poco, como AoE4, medido con torneo<\/p>"], "estado": "pendiente", "tema": "sitios"}, {"id": "C-63", "titulo": "Sitios apagados para la IA contra IA", "cuerpo": "<p>La primera partida en Fácil arranca con los sitios apagados. En IA contra IA, desde el menú, la opción depende de la dificultad elegida para el jugador.<\/p>", "opciones": [["a", "Que IA contra IA siempre arranque con los sitios prendidos", true], ["b", "Igual que la partida normal", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Que IA contra IA siempre arranque con los sitios prendidos<\/p>"], "estado": "pendiente", "tema": "menú"}, {"id": "C-64", "titulo": "La micro: que la mezcla de línea y distancia pague", "cuerpo": "<p>El veterano lo pide por tercera ronda. El estudio (<code>proceso/24-tras-la-segunda-ronda/5a-micro-estudio.md<\/code>) encontró dos causas. El guerrero común corre más que el hondero (1600 contra 1250), así que funciona como un jinete a pie y no se lo puede kitear. Y el hondero casi no le hace daño. Lo que ya paga: la línea mantiene y la distancia escalona detrás.<\/p><ul><li>Con a), 5 lanceros + 5 honderos sin micro pasan de ganar 1 de 5 a ganar 5 de 5 contra 10 guerreros, y los honderos que escalonan quedan con 5,2 vivos.<\/li><li>El weichafe, el jinete noble y el jinete conservan su velocidad.<\/li><\/ul>", "opciones": [["a", "Guerrero común a 1350 y la línea +6 contra el choque (antes +5), como el hombre de armas de AoE4, medido con torneo", true], ["b", "Solo la línea +10 contra el choque", false], ["c", "Un hostigador montado por pueblo (pide modelo, edificio e IA)", false], ["d", "Dejarlo así y enseñar en el juego la micro que ya paga", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Guerrero común a 1350 y la línea +6 contra el choque (antes +5), como el hombre de armas de AoE4, medido con torneo<\/p>"], "estado": "pendiente", "tema": "combate"}, {"id": "C-65", "titulo": "Velocidad de las unidades", "cuerpo": "<p>Del análisis de escala del veterano (<code>proceso/22-testers/ronda-4/03-escala-veterano.md<\/code>): el aldeano anda a 1,86 m/s, un trote, cerca de 35 % más rápido que en AoE4 en relación con su cuerpo. Con la persona más chica (paso 1, solo vista) va a parecer más rápido todavía. Bajar <code>velocidad_pct<\/code> de 90 a 72 cambia toda la simulación: viajes, economía, llegada de ataques y micro.<\/p>", "opciones": [["a", "Bajarla a 72 con un torneo de 10 semillas solo para eso, y mirarlo vos a ×1", true], ["b", "Probar 80", false], ["c", "Dejarla", false]], "respuesta": "<p>c) Dejarla. El autor (2026-11-16): \"¿Era solo un tema visual? Ignoremos entonces, porque necesitamos eventualmente hacer animaciones para los modelos que logremos generar, así que hasta que podamos no vale la pena.\" Se retoma con las animaciones de los modelos.<\/p>", "hecho": [], "estado": "respondida", "tema": "escala"}, {"id": "C-66", "titulo": "Huellas del centro y los hitos", "cuerpo": "<p>En AoE4 el centro y los hitos dominan la ciudad. Acá ocupan 4×4 casillas (el lof mapuche, 3×3). Pasarlos a 5×5 (el lof a 4×4) toca la colocación, la IA, el generador de mapas (quizás un mapa de 136 en vez de 128), los caminos, las 25 misiones y el balance. Las casas, granjas y almacenes no cambian.<\/p>", "opciones": [["a", "Esperar a ver el paso 1 (solo vista) y decidir después", true], ["b", "Hacerlo ya, con su torneo", false], ["c", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Esperar a ver el paso 1 (solo vista) y decidir después<\/p>"], "estado": "pendiente", "tema": "escala"}, {"id": "C-67", "titulo": "La yerba", "cuerpo": "<p>Hoy la roza agotada deja un yerbal. Pero la yerba (<em>ka'a<\/em>) era un árbol silvestre del monte. En la colonia se cosechó con trabajo forzado de encomienda, y solo las reducciones del siglo XVIII la plantaron (Garavaglia, 1983).<\/p>", "opciones": [["a", "La yerba como recurso silvestre del monte; el yerbal plantado recién en la vía misión; la roza agotada deja capuera; ganado vacuno en la vía misión. Medido con torneo", true], ["b", "Dejarlo y aclararlo en la descripción", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) La yerba como recurso silvestre del monte; el yerbal plantado recién en la vía misión; la roza agotada deja capuera; ganado vacuno en la vía misión. Medido con torneo<\/p>"], "estado": "pendiente", "tema": "historia, guaraníes"}, {"id": "C-68", "titulo": "Pacto de Cucaú y liberación", "cuerpo": "<p>El Pacto de Cucaú promete \"cerrar la puerta a quienes llegan\", pero en los datos es un +25 % sin costo. La liberación \"libera\" gente de cualquier casa enemiga, también guaraní o etíope.<\/p>", "opciones": [["a", "El pacto apaga o reduce a la mitad la acogida y la liberación; la liberación vale solo contra los ingenios y los invasores (contra los demás pueblos, nada). Medido con torneo", true], ["b", "Dejarlo", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El pacto apaga o reduce a la mitad la acogida y la liberación; la liberación vale solo contra los ingenios y los invasores (contra los demás pueblos, nada). Medido con torneo<\/p>"], "estado": "pendiente", "tema": "historia, Palmares"}, {"id": "C-69", "titulo": "Lalibela y la iglesia", "cuerpo": "<p>Lalibela es un sitio zagwe del siglo XIII con culto vivo: en el juego se construye y da +25 % de vida a los edificios. La iglesia da +5 % de vida a las tropas.<\/p>", "opciones": [["a", "Lalibela pasa a sitio sagrado neutral del mapa (no se construye) y el hito se ve como Debre Damo; la iglesia cambia su bono de combate por uno económico o de población", true], ["b", "Dejarlo", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Lalibela pasa a sitio sagrado neutral del mapa (no se construye) y el hito se ve como Debre Damo; la iglesia cambia su bono de combate por uno económico o de población<\/p>"], "estado": "pendiente", "tema": "historia, Etiopía"}, {"id": "C-70", "titulo": "Nombres de edad", "cuerpo": "<p>Las propuestas de los historiadores:<\/p><ul><li>incas: <em>Inkarri<\/em> → <em>Willkapampa<\/em>, y el hito militar → <em>Espíritu Pampa<\/em> (C-39);<\/li><li>guaraníes: <em>Tekoha → Guára → Mbororé → Ñande retã<\/em> (C-41; desaconsejan <em>tovaja<\/em>; <em>guára<\/em>, a confirmar con un hablante);<\/li><li>birmanos: <em>Hanthawaddy<\/em> → <em>Toungoo<\/em>;<\/li><li>Ayutthaya: <em>Mueang Tha<\/em> → <em>Krung Thonburi<\/em>, y explicar <em>Ekkarat<\/em> en el panel;<\/li><li>Palmares: no la a) de C-42, sino la b) \"1678\" o la d);<\/li><li>Qorikancha: a la edad II o III (C-40 b).<\/li><\/ul>", "opciones": [["a", "Todo eso", true], ["b", "Elegir de a uno (decí cuáles)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Todo eso<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-71", "titulo": "Birmania y los extranjeros de Ayutthaya", "cuerpo": "<ul><li><em>Bayingyi<\/em> (tiradores) y <em>kathe<\/em> (caballería) son de 1613 en adelante y de la época Konbaung; en la edad II y en Nong Sarai (1593) son anacrónicos.<\/li><li>Falta el barrio chino, la comunidad extranjera más grande de Ayutthaya (defendió la muralla en 1767 y sostuvo a Taksin).<\/li><\/ul>", "opciones": [["a", "Bayingyi y kathe solo en la edad IV (antes, \"tiradores portugueses a sueldo\" y \"jinete shan\"); barrio chino como tercer barrio de Ayutthaya; Birmania con monasterio de teca, pyatthat y zedi propios", true], ["b", "Solo los nombres", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Bayingyi y kathe solo en la edad IV (antes, \"tiradores portugueses a sueldo\" y \"jinete shan\"); barrio chino como tercer barrio de Ayutthaya; Birmania con monasterio de teca, pyatthat y zedi propios<\/p>"], "estado": "pendiente", "tema": "historia, Asia"}, {"id": "C-72", "titulo": "Otros nombres", "cuerpo": "<ul><li><strong>Hitos mapuches:<\/strong> Malón del toqui, Nguillatuwe del rewe, Corral de la remonta (o <em>Kawellu<\/em>) y Pewenal. Hoy inventan cargos como \"toqui de caballería\".<\/li><li><strong>Edificios:<\/strong> \"Ruka de guerra\" → \"Junta de guerra\"; \"Kamayuq wasi\" → <em>Qhuya wasi<\/em>; \"Tukul\" → <em>Gojjo bet<\/em>.<\/li><li><strong>Ayutthaya:<\/strong> la riqueza pasa a llamarse \"Suai (pago al rey)\".<\/li><li><strong>Rebaños:<\/strong> cerdo o gallinas en Palmares; buey cebú en Etiopía.<\/li><li><strong>Rivales:<\/strong> europeos por potencia, y Velho como facción \"paulista\" (C-44 b).<\/li><\/ul>", "opciones": [["a", "Todo eso", true], ["b", "De a uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Todo eso<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-73", "titulo": "Lo que quedaba abierto", "cuerpo": "<ul><li>C-58: nagarit (el timbal real de guerra) en la fanfarria y la alarma etíopes, en lugar del kebero litúrgico.<\/li><li>C-59: sacar <em>Tra Nimit<\/em> (muy probablemente del repertorio ceremonial <em>naphat<\/em>; la grabación es de una banda naval de 1934). Hoy es la única pista propia de Ayutthaya.<\/li><li>Alarma de Ayutthaya con klong chana, pi chawa y sang.<\/li><\/ul>", "opciones": [["a", "Todo eso, con música propia de paz para Palmares (ngoma y marimba) y para Ayutthaya, sintetizadas", true], ["b", "De a uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Todo eso, con música propia de paz para Palmares (ngoma y marimba) y para Ayutthaya, sintetizadas<\/p>"], "estado": "pendiente", "tema": "historia, sonido"}, {"id": "C-74", "titulo": "Representación y consultas", "cuerpo": "<ul><li><strong>Wat:<\/strong> que no muestre una imagen del Buda reconocible hasta consultar, y revisar si conviene que se pueda destruir.<\/li><li><strong>Hito guaraní:<\/strong> la mbaraka sale del modelo hasta la consulta mbyá (C-60 b).<\/li><li><strong>A futuro:<\/strong> los oromo como facción de IA, con el gada; misiones de Adal; rivales Lan Na, Lan Xang y Camboya.<\/li><li><strong>Consultas antes de publicar:<\/strong><\/li><li>la Iglesia ortodoxa Tewahedo;<\/li><li>las comunidades hararí, oromo y beta israel;<\/li><li>las organizaciones mapuches, mbyá, quechuas y quilombolas (CONAQ);<\/li><li>mestres de capoeira angola;<\/li><li>lingüistas de kimbundu.<\/li><\/ul>", "opciones": [["a", "Así", true], ["b", "Otra cosa", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "historia"}, {"id": "C-75", "titulo": "Regla del ×2", "cuerpo": "<p>¿\"Una unidad de la edad IV no vale más de dos comunes\" (ley cuadrada, como mide el modelo) o \"ni el ataque ni la vida pasan de ×2\" (más permisiva)?<\/p>", "opciones": [["a", "Valor en comunes", true], ["b", "Por estadística", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Valor en comunes<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-76", "titulo": "Hitos militares con aura", "cuerpo": "<p>En la III y la IV, el bono del hito militar vale solo cerca del hito, en lugar de ser global. Es lo que más desinfla la edad IV.<\/p>", "opciones": [["a", "Sí, en el paso 4", true], ["b", "Solo el de la IV", false], ["c", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, en el paso 4<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-77", "titulo": "Paso 1", "cuerpo": "<p>Sacar el bono automático de ataque por edad y reemplazarlo por cosas que se compran: el +10 % de la II va a la herrería I, y los niveles veterano y élite se compran. El modelo da el mismo poder (0 a −2 %).<\/p>", "opciones": [["a", "Sí, arrancar por ahí", true], ["b", "Primero la herrería separada", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí, arrancar por ahí<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-78", "titulo": "Maravilla", "cuerpo": "<p>Costo de 1500 de madera, piedra y riqueza; 600 s de obra; una cuenta de 15 minutos para ganar; opción del menú.<\/p>", "opciones": [["a", "Así", true], ["b", "Otros números", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-79", "titulo": "Maravilla de Ayutthaya", "cuerpo": "<p>Krung, la ciudad isla con el fuerte Phom Phet (no es sagrada), o el Wat Phra Si Sanphet (con consulta).<\/p>", "opciones": [["a", "Krung", true], ["b", "El wat, si la consulta lo acepta", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): el historiador de Asia recomienda cerrarla en a). Hacer del Wat Phra Si Sanphet una maravilla repite el saqueo de 1767.<\/p>"], "estado": "pendiente", "tema": "juego tardío"}, {"id": "C-80", "titulo": "Unidades nuevas sin modelo", "cuerpo": "<p>¿Esperan al arte o entran con una maqueta de silueta propia?<\/p>", "opciones": [["a", "Esperan", true], ["b", "Maqueta con silueta propia", false]], "respuesta": "", "hecho": ["<p>Destrabada por la decisión del comercio (2026-11-19): las unidades nuevas entran con maqueta procedural. Desde el 2026-11-21 hay arte en gouache de los seis pueblos (<code>proceso/49<\/code>).<\/p>"], "estado": "respondida", "tema": "juego tardío"}, {"id": "C-81", "titulo": "Trepanación", "cuerpo": "<p>El saber destacado inca: el 20 % de los caídos cerca del sanador o de la kallanka vuelve con media vida, en lugar de un sanador más fuerte. Evidencia arqueológica fuerte (Verano, 2016).<\/p>", "opciones": [["a", "Así", true], ["b", "Solo un sanador más fuerte", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): la cifra queda corregida (en la época inca sobrevivía el 75–83 %; en la Guerra Civil de Estados Unidos moría el 46–56 %), como un saber de dos mil años que el Inka heredó. La mecánica pasa a \"el 20 % de los que caen por golpe no muere y vuelve herido\", para que no se lea como resurrección.<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-82", "titulo": "Etiopía y el *Bahrä Hasab*", "cuerpo": "<p>Un saber eclesiástico (el cómputo del calendario) usado en una mecánica económica.<\/p>", "opciones": [["a", "Consultar a la Iglesia Tewahedo y, si no, \"Cartógrafos de la corte\"", true], ["b", "Sacarlo ya", false]], "respuesta": "", "hecho": ["<p>Revisión histórica (etapa 26): el Bahrä Hasab es el cómputo de la Pascua, y ninguna fuente dice que ordenara las mudanzas de la corte. La opción nueva por defecto es el orden del kätäma (el campamento real armado siempre con el mismo plano), que está documentado.<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-83", "titulo": "Saberes con evidencia \"debatida\"", "cuerpo": "<p>El kilombo, el shotel, los armeros de Gondar y el yachaywasi tienen evidencia debatida.<\/p>", "opciones": [["a", "Entran con la marca \"debatido\" en la ficha", true], ["b", "Solo saberes documentados y arqueológicos", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Entran con la marca \"debatido\" en la ficha<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-84", "titulo": "Élite de la vía monte", "cuerpo": "<p>Sepé y la Guerra Guaranítica eran de los pueblos de misión. La élite de la vía monte pasa a los <em>ka'aguygua<\/em> (\"monteses\") [verificar grafía].<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, guaraníes"}, {"id": "C-85", "titulo": "Maravilla", "cuerpo": "<p><em>Tekoha guasu<\/em> es una categoría del siglo XX, hoy usada en litigios por tierras. Pasa a llamarse \"Aldea grande del monte\" hasta la consulta.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, guaraníes"}, {"id": "C-86", "titulo": "Ampive y poncho", "cuerpo": "<p><em>Lawentuchefe<\/em> es un término de fines del siglo XX y la platería, de fines del XVIII. Pasan a <em>ampive<\/em> [verificar] y al poncho (<em>makuñ<\/em>).<\/p>", "opciones": [["a", "Los dos", true], ["b", "Solo uno", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Los dos<\/p>"], "estado": "pendiente", "tema": "saberes, mapuches"}, {"id": "C-87", "titulo": "Pieza pesada de la IV", "cuerpo": "<p>Las armas capturadas en Vilcabamba, en lugar de repetir las galgas.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, incas"}, {"id": "C-88", "titulo": "Huayrachina", "cuerpo": "<p>El horno de viento que fundió la plata de Potosí: documentado y arqueológico. Entra en la IV, y los <em>mitmaqkuna<\/em> quedan para retomar.<\/p>", "opciones": [["a", "Sí", true], ["b", "No", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, incas"}, {"id": "C-89", "titulo": "Escuela de la IV", "cuerpo": "<p><em>Oficinas do Macaco<\/em>: herreros, alfareros y tejedores de palma.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-90", "titulo": "Guerrero de gaša", "cuerpo": "<p>El \"shotel que pasa por encima del escudo\" es folclore moderno. Pasa a ser el guerrero de <em>gaša<\/em> (escudo) con jabalinas, sin ese bono.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Etiopía"}, {"id": "C-91", "titulo": "Jinetes oromo aliados", "cuerpo": "<p>El <em>gadaa<\/em> es un sistema de grados de edad, no un cuerpo montado. La élite de la IV pasa a ser jinetes oromo aliados por un tratado que se puede romper.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Etiopía"}, {"id": "C-92", "titulo": "Hierro de Angola Janga", "cuerpo": "<p>El hierro iba a armas y herramientas: la mejora da +1 de ataque en lugar de armadura.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-93", "titulo": "Erveira y sanguar", "cuerpo": "<p>El sanador es la <em>erveira<\/em> (Sweet, 2003, nivel \"debatido\"; nunca <em>nganga<\/em>). La mejora de curadores pasa al <em>sanguar<\/em>, la técnica de esquivar proyectiles, aclarando que no es capoeira.<\/p>", "opciones": [["a", "Las dos", true], ["b", "Solo una", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Las dos<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-94", "titulo": "Saberes nuevos de Etiopía y Palmares", "cuerpo": "<p><em>Ṭef<\/em> y <em>gotära<\/em>, <em>kosso<\/em>, los mercaderes <em>jabarti<\/em>, los <em>ṣäḥafe tə'əzaz<\/em>; tejido de palma y cerámica de los mocambos.<\/p>", "opciones": [["a", "Como quedan en el diseño", true], ["b", "Elegir", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Como quedan en el diseño<\/p>"], "estado": "pendiente", "tema": "saberes"}, {"id": "C-95", "titulo": "Sin astrología de corte", "cuerpo": "<p>La astrología de corte (los <em>hon<\/em>) se usaba como bono. Pasa a astilleros de juncos y al Phra Khlang con sus intérpretes.<\/p>", "opciones": [["a", "Sí", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Ayutthaya"}, {"id": "C-96", "titulo": "Saberes nuevos", "cuerpo": "<p>La cerámica de Si Satchanalai, los <em>khlong lat<\/em> y el <em>nuat<\/em>.<\/p>", "opciones": [["a", "Sí", true], ["b", "Elegir", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Sí<\/p>"], "estado": "pendiente", "tema": "saberes, Ayutthaya"}, {"id": "C-97", "titulo": "La maravilla", "cuerpo": "<p>La Cerca do Outeiro da Barriga queda \"sitiada\" hasta consultar si se puede mostrar su caída.<\/p>", "opciones": [["a", "Así", true], ["b", "Otra", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Así<\/p>"], "estado": "pendiente", "tema": "saberes, Palmares"}, {"id": "C-98", "titulo": "Aspecto de los aldeanos animados", "cuerpo": "<p>De lejos, el aldeano animado se ve más claro y menos integrado que el modelo de Meshy: ganamos el movimiento y perdimos textura.<\/p>", "opciones": [["a", "Dejarlos animados y riggear los modelos de Meshy cuando se pueda, para tener las dos cosas", true], ["b", "Volver a Meshy quieto hasta riggear", false], ["c", "Animados, pero con colores más oscuros y terrosos ya", true]], "respuesta": "", "hecho": ["<p>Se hizo a + c: aldeanos animados con KayKit y tonos más terrosos. El rig propio ya existe en el pipeline 3D local (<code>proceso/47<\/code>): el aldeano inca anda con las animaciones de KayKit en el visor, falta pasarlo a <code>AldeanoAnimado<\/code>.<\/p>"], "estado": "pendiente", "tema": "animaciones"}, {"id": "C-99", "titulo": "Tono y armas", "cuerpo": "<p>¿Alcanza el tono del aldeano o lo oscurecemos más? ¿Un tono de piel por pueblo? ¿Están bien las armas de cada pueblo (macana a dos manos para guaraníes y mapuches, dos espadas para Ayutthaya, jabalina etíope, estólica caranqui)?<\/p>", "opciones": [["a", "Así como está", true], ["b", "Más oscuro, con un tono por pueblo", false], ["c", "Cambiar armas (escribí cuáles)", false]], "respuesta": "", "hecho": ["<p>Quedó así como está. Los modelos nuevos del pipeline (<code>proceso/49<\/code>, <code>50<\/code>) toman el tono de piel del arte 2D de cada pueblo.<\/p>"], "estado": "pendiente", "tema": "animaciones"}, {"id": "C-100", "titulo": "¿Reparar cuesta?", "cuerpo": "<p>En AoE4 reparar cuesta una parte del edificio; acá hoy es gratis.<\/p>", "opciones": [["a", "El 50 % del costo, proporcional a lo reparado", true], ["b", "Gratis, como hoy", false], ["c", "Otro porcentaje (escribilo)", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) El 50 % del costo, proporcional a lo reparado<\/p>"], "estado": "pendiente", "tema": "fluidez"}, {"id": "C-101", "titulo": "Muralla de piedra y planos", "cuerpo": "<p>¿Una muralla de piedra en la II con torres encima, y la empalizada que se refuerza? ¿Planos para dibujar la base sin pagar?<\/p>", "opciones": [["a", "La muralla sí; los planos, después", true], ["b", "Las dos cosas ya", false]], "respuesta": "<p>Muralla de piedra sí, en la edad II (2026-11-18).<\/p>", "hecho": [], "estado": "respondida", "tema": "fluidez"}, {"id": "C-102", "titulo": "¿Dónde va el relevo?", "cuerpo": "<p>Para jugar por internet, los dos se conectan a un relevo (<code>server/relevo.py<\/code>). Opciones, con los pasos en <code>44-version-para-amigos/guia-relevo-y-versiones.md<\/code>:<\/p><p>Cuando lo tengas, poné <code>RELEVO=host:47900<\/code> en <code>~/.config/raices/publicar.env<\/code>. Así los amigos solo escriben el código de la sala.<\/p>", "opciones": [["a", "En tu PC, con el puerto 47900/TCP abierto en el router: gratis, pero solo anda con la PC prendida, y si tenés CGNAT no se puede", false], ["b", "Oracle Cloud Always Free: gratis y siempre prendido, pero con más vueltas para crearlo", false], ["c", "Un VPS de 4–6 USD por mes (Hetzner, DigitalOcean): lo más simple y estable", true]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: c) Un VPS de 4–6 USD por mes (Hetzner, DigitalOcean): lo más simple y estable<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-103", "titulo": "Página de itch.io", "cuerpo": "<p>Para que la app de itch les actualice el juego solo, hace falta una página. Va con estos pasos: crearla en modo <strong>Restricted<\/strong> o <strong>Draft<\/strong>, correr <code>butler login<\/code>, poner <code>ITCH_TARGET=usuario/raices<\/code> en <code>~/.config/raices/publicar.env<\/code> y correr <code>tools/publicar.sh --subir<\/code>. ¿Cómo entran los amigos?<\/p>", "opciones": [["a", "Con una clave de descarga por amigo", true], ["b", "Con una contraseña de página para todos", false], ["c", "Nada de itch por ahora: les mando los zip a mano", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Con una clave de descarga por amigo<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-104", "titulo": "Nombre de la versión", "cuerpo": "<p>Hoy la versión es <code>AAAA.MM.DD-commit<\/code> (por ejemplo <code>2026.11.20-1a2b3c4<\/code>). ¿Te sirve, o preferís un número (0.1, 0.2…) que subas vos?<\/p>", "opciones": [["a", "Fecha y commit", true], ["b", "Número a mano, más el commit", false]], "respuesta": "", "hecho": ["<p>Se sigue con la opción por defecto: a) Fecha y commit<\/p>"], "estado": "pendiente", "tema": "general"}, {"id": "C-105", "titulo": "3D local: ¿seguimos? (proceso/43)", "cuerpo": "<p>Hunyuan3D-2mini turbo da formas buenas en la PC (ver <code>proceso/43-3d-local/index.html<\/code>). Para seguir hacen falta cosas que no hago solo: (1) instalar el toolkit de CUDA 12.8 con un gcc 13 o 14 (para la textura propia de Hunyuan); (2) aceptar la licencia de Stable Fast 3D con tu cuenta de Hugging Face, si querés compararlo; (3) Mixamo, con tu cuenta, si el autorrig de Blender no alcanza. ¿Qué hacemos?<\/p>", "opciones": [["a", "Pasar los aldeanos y edificios de los incas a esta cadena y probar el rig en Godot", true], ["b", "Primero la textura de Hunyuan (instalás el toolkit)", false], ["c", "Dejarlo acá y seguir con Meshy", false]], "respuesta": "", "hecho": ["<p>Respondida en el chat (2026-11-20/21): instalar CUDA y seguir. Hecho: textura de Hunyuan3D-Paint, <code>tools/gen3d_pipeline.py<\/code>, 24 modelos de los seis pueblos y el arreglo de la piel oscura (<code>proceso/47<\/code>, <code>49<\/code>, <code>50<\/code>).<\/p>"], "estado": "respondida", "tema": "general"}, {"id": "C-106", "titulo": "Modelos del pipeline 3D en el juego (proceso/47)", "cuerpo": "<p>Los cuatro modelos nuevos (aldeano, kancha, kallanka y caballo, con textura de Hunyuan3D-Paint) están en <code>assets/generados/modelos/local/<\/code> y no se usan todavía. Ver el antes y después en <code>proceso/47-pipeline-3d/README.md<\/code>.<\/p>", "opciones": [["a", "Usar ya la kancha y la kallanka (estáticas) en los incas y dejar el aldeano para cuando <code>AldeanoAnimado<\/code> acepte modelos riggeados", true], ["b", "Usar los cuatro ya, con el aldeano quieto como el GLB de hoy", false], ["c", "Esperar a pasar todas las civilizaciones por el pipeline", false]], "respuesta": "", "hecho": ["<p>Los modelos no se usan todavía en el juego. Desde que se escribió la pregunta, ya pasaron por el pipeline los seis pueblos (la condición de la c) se cumplió) y se arregló la piel oscura (<code>proceso/50<\/code>).<\/p>"], "estado": "pendiente", "tema": "general"}];
const LS = "raices_consultas_v1";
let mias = {};           // id -> {opcion, texto, fecha}
let db = null, col = null;
let filtro = "pendiente", busca = "";
try { mias = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { mias = {}; }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plano = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };

function tieneMia(id){ const m = mias[id]; return !!(m && (m.opcion || (m.texto || "").trim())); }

function resumen(){
  const pend = CONSULTAS.filter(c => c.estado === "pendiente").length;
  const resp = CONSULTAS.filter(c => c.estado === "respondida").length;
  const tuyas = CONSULTAS.filter(c => tieneMia(c.id)).length;
  $("#resumen").innerHTML = `<span><b>${CONSULTAS.length}</b> consultas</span><span><b>${pend}</b> sin respuesta</span><span><b>${resp}</b> ya respondidas</span><span><b>${tuyas}</b> contestadas acá</span>`;
}

function visible(c){
  if (filtro === "pendiente" && c.estado !== "pendiente") return false;
  if (filtro === "respondida" && c.estado !== "respondida") return false;
  if (filtro === "tuyas" && !tieneMia(c.id)) return false;
  if (!busca) return true;
  const t = (c.id + " " + c.tema + " " + c.titulo + " " + plano(c.cuerpo) + " " + c.opciones.map(o => plano(o[1])).join(" ")).toLowerCase();
  return busca.split(/\s+/).every(p => t.includes(p));
}

function ficha(c){
  const m = mias[c.id] || {};
  const tuya = tieneMia(c.id);
  const ops = c.opciones.map(o => `
    <label class="op${m.opcion === o[0] ? " marcada" : ""}">
      <input type="radio" name="op-${c.id}" id="op-${c.id}-${o[0]}" value="${o[0]}"${m.opcion === o[0] ? " checked" : ""}>
      <span><b>${o[0]})</b> ${o[1]}${o[2] ? '<span class="def">por defecto</span>' : ""}</span>
    </label>`).join("");
  const elegir = `
    <div class="elige">
      ${ops ? '<span class="et">Elegí una opción</span>' + ops : '<span class="et">Tu respuesta</span>'}
      <textarea id="tx-${c.id}" placeholder="${ops ? "Otra respuesta, matiz o comentario (opcional)" : "Escribí tu respuesta"}">${esc(m.texto || "")}</textarea>
      <div class="pie"><span id="st-${c.id}">${tuya ? "Guardada" + (m.fecha ? " · " + new Date(m.fecha).toLocaleString("es-AR", {dateStyle:"short", timeStyle:"short"}) : "") : ""}</span>
      ${tuya ? `<button type="button" data-borrar="${c.id}">Borrar mi respuesta</button>` : ""}</div>
    </div>`;
  const estado = tuya ? "tuya" : c.estado;
  const etEstado = {pendiente:"sin respuesta", respondida:"respondida", reemplazada:"reemplazada", tuya:"contestada acá"}[estado];
  const ya = c.respuesta ? `<div class="resp"><span class="et">Respuesta</span>${c.respuesta}</div>` : "";
  const hecho = c.hecho.length ? `<div class="hecho"><span class="et">${c.estado === "pendiente" ? "Mientras tanto hicimos" : "Lo que se hizo"}</span>${c.hecho.join("")}</div>` : "";
  const cuerpoElegir = c.estado === "pendiente" || tuya ? elegir
    : `<details class="cambiar"><summary>Cambiar la respuesta</summary>${elegir}</details>`;
  return `<article class="ficha ${estado}" id="${c.id}" data-id="${c.id}">
    <div class="cab"><span class="num">${c.id}</span><span class="tema">${esc(c.tema)}</span><span class="estado ${estado}">${etEstado}</span></div>
    <h2>${esc(c.titulo)}</h2>
    ${c.cuerpo ? `<div class="cuerpo">${c.cuerpo}</div>` : ""}
    ${ya}${hecho}${cuerpoElegir}
  </article>`;
}

function pintar(){
  resumen();
  const vis = CONSULTAS.filter(visible);
  $("#lista").innerHTML = vis.length ? vis.map(ficha).join("")
    : `<p class="vacio">${filtro === "tuyas" ? "Todavía no contestaste ninguna acá. Elegí una opción en «Pendientes» y queda guardada." : "No hay consultas con ese filtro."}</p>`;
}

// Guardado: una escritura por consulta a la vez; la última gana.
const enCurso = {}, pendiente = {};
async function guardar(id){
  const m = mias[id];
  try { localStorage.setItem(LS, JSON.stringify(mias)); } catch (e) {}
  const st = document.getElementById("st-" + id);
  if (!col) { if (st) st.textContent = "Guardada en este navegador"; resumen(); return; }
  if (enCurso[id]) { pendiente[id] = true; return; }
  enCurso[id] = true;
  if (st) st.textContent = "Guardando…";
  try {
    if (m && (m.opcion || (m.texto || "").trim())) await col.doc(id).set({opcion: m.opcion || "", texto: m.texto || "", fecha: m.fecha});
    else await col.doc(id).delete();
    if (st) st.textContent = m ? "Guardada" : "";
  } catch (e) {
    if (st) st.textContent = "No se pudo guardar en línea (" + (e && e.code || "error") + "): quedó en este navegador; usá «Copiar mis respuestas».";
  }
  enCurso[id] = false;
  if (pendiente[id]) { pendiente[id] = false; guardar(id); }
  resumen();
}

const timers = {};
document.addEventListener("change", e => {
  const r = e.target;
  if (r.type !== "radio") return;
  const id = r.name.slice(3);
  mias[id] = Object.assign({}, mias[id], {opcion: r.value, fecha: new Date().toISOString()});
  r.closest(".elige").querySelectorAll(".op").forEach(l => l.classList.toggle("marcada", l.contains(r)));
  guardar(id);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (!t.id || !t.id.startsWith("tx-")) return;
  const id = t.id.slice(3);
  mias[id] = Object.assign({}, mias[id], {texto: t.value, fecha: new Date().toISOString()});
  const st = document.getElementById("st-" + id); if (st) st.textContent = "Escribiendo…";
  clearTimeout(timers[id]); timers[id] = setTimeout(() => guardar(id), 1200);
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-borrar]");
  if (b) { const id = b.dataset.borrar; delete mias[id]; guardar(id).then(pintar); return; }
  const f = e.target.closest(".filtros button");
  if (f) { filtro = f.dataset.f; document.querySelectorAll(".filtros button").forEach(x => x.setAttribute("aria-pressed", x === f)); pintar(); }
});
$("#buscar").addEventListener("input", e => { busca = e.target.value.trim().toLowerCase(); pintar(); });

$("#copiar").addEventListener("click", async () => {
  const lineas = CONSULTAS.filter(c => tieneMia(c.id)).map(c => {
    const m = mias[c.id], o = c.opciones.find(x => x[0] === m.opcion);
    return `${c.id} · ${c.titulo}: ${o ? o[0] + ") " + plano(o[1]) : ""}${(m.texto || "").trim() ? (o ? " — " : "") + m.texto.trim() : ""}`;
  });
  const txt = lineas.length ? lineas.join("\n") : "Todavía no hay respuestas.";
  const area = $("#copia");
  try { await navigator.clipboard.writeText(txt); $("#copiar").textContent = "¡Copiadas!"; area.hidden = true; }
  catch (e) { area.value = txt; area.hidden = false; area.select(); $("#copiar").textContent = "Seleccioná y copiá"; }
  setTimeout(() => $("#copiar").textContent = "Copiar mis respuestas", 2500);
});

pintar();

// Base del artifact: lo que elegís queda guardado y Claude lo lee para pasarlo a CONSULTAS.md.
(async () => {
  const aviso = $("#aviso");
  const corte = setTimeout(() => { if (!col) aviso.textContent = "Sin conexión al guardado: tus respuestas quedan en este navegador. Usá «Copiar mis respuestas» y pegalas en el chat."; }, 10000);
  try { db = window.claude && await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { clearTimeout(corte); aviso.textContent = "Tus respuestas quedan en este navegador. Usá «Copiar mis respuestas» y pegalas en el chat."; return; }
  col = db.collection("respuestas");
  col.onSnapshot(snap => {
    clearTimeout(corte);
    const remotas = {};
    snap.docs.forEach(d => { const v = d.data(); if (v) remotas[d.id] = v; });
    // Lo local que todavía no subió se sube; lo remoto manda en lo demás.
    const subir = Object.keys(mias).filter(id => !remotas[id] || (mias[id].fecha || "") > (remotas[id].fecha || ""));
    mias = Object.assign({}, remotas);
    try { const loc = JSON.parse(localStorage.getItem(LS) || "{}"); subir.forEach(id => { if (loc[id]) mias[id] = loc[id]; }); } catch (e) {}
    aviso.textContent = "Lo que elegís se guarda solo y Claude lo lee desde acá. También podés copiarlo y pegarlo en el chat.";
    const activo = document.activeElement && document.activeElement.id;
    if (!activo || !activo.startsWith("tx-")) pintar(); else resumen();
    subir.forEach(id => guardar(id));
  }, err => {
    clearTimeout(corte); col = null;
    aviso.textContent = "No se pudo leer el guardado (" + (err && err.code || "error") + "): tus respuestas quedan en este navegador; usá «Copiar mis respuestas».";
  });
})();
</script>
